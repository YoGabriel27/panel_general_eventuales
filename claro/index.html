const CLARO_STATE_KEY = "estado_claro_v1";

async function storageGet() {
  const { data, error } = await supabaseClient
    .from("app_state").select("data").eq("key", CLARO_STATE_KEY).maybeSingle();
  if (error || !data) return null;
  const state = data.data || {};
  return { rows: state.rows || [], lastUpload: state.lastUpload || null, sheetUrl: state.sheetUrl || "" };
}

async function storageSet(state) {
  const payload = { rows: state.rows || [], lastUpload: state.lastUpload || null, sheetUrl: state.sheetUrl || "" };
  const { error } = await supabaseClient
    .from("app_state")
    .upsert({ key: CLARO_STATE_KEY, data: payload, updated_at: new Date().toISOString() });
  if (error) console.error("storageSet", error);
  return !error;
}

/* Extrae el ID de un link de Google Sheets pegado tal cual (o ya el ID
   solo, si alguien lo pega directamente). Formato típico:
   https://docs.google.com/spreadsheets/d/{ID}/edit?gid=... */
function extraerIdGoogleSheet(texto) {
  const t = String(texto || "").trim();
  const m = t.match(/\/spreadsheets\/d\/([a-zA-Z0-9-_]+)/);
  if (m) return m[1];
  if (/^[a-zA-Z0-9-_]{20,}$/.test(t)) return t; // ya parece un ID solo
  return "";
}
function sheetExportUrl(id) {
  return `https://docs.google.com/spreadsheets/d/${id}/export?format=xlsx`;
}

   UTILIDADES
--------------------------------------------------------- */
function uid() { return `${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 9)}`; }
function todayISO() { return new Date().toISOString().slice(0, 10); }
function excelSerialToISO(v) {
  // Convierte un número de serie de fecha de Excel a "YYYY-MM-DD". Si no
  // parece un número de serie válido, devuelve el valor original sin tocar.
  const n = Number(v);
  if (!Number.isFinite(n) || n < 20000 || n > 60000) return v == null ? "" : String(v).trim();
  const d = new Date(Math.round((n - 25569) * 86400 * 1000));
  if (isNaN(d.getTime())) return String(v).trim();
  return d.toISOString().slice(0, 10);
}
function normalizeHeader(h) {
  return String(h || "")
    .toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "") // saca acentos
    .replace(/[^a-z0-9]+/g, " ")
    .trim();
}

/* ---------------------------------------------------------
   DEFINICIÓN DE COLUMNAS
   Mismos campos que la planilla original de Claro. Todo se guarda y
   edita como texto libre (no se fuerza formato de fecha/número) porque
   la fuente real trae datos mixtos (ej. "falta nro recepcion" en FC).
--------------------------------------------------------- */
const COLUMNS = [
  { key: "ppto", label: "Ppto", width: 60 },
  { key: "cta", label: "Cta", width: 55 },
  { key: "descripcion", label: "Eventual (código y descripción)", width: 320 },
  { key: "edificio", label: "Edificio", width: 160 },
  { key: "referente", label: "Referente", width: 140 },
  { key: "fechaRecepcion", label: "Fecha recepción", width: 110 },
  { key: "fechaEnvio", label: "Fecha envío", width: 110 },
  { key: "mes", label: "Mes", width: 90 },
  { key: "montoSIva", label: "Monto S/IVA", width: 120 },
  { key: "fechaAprobacion", label: "Fecha aprobación", width: 110 },
  { key: "aprobacion", label: "Aprobación", width: 90 },
  { key: "ejecucion", label: "Ejecución", width: 90 },
  { key: "fechaEjecucion", label: "Fecha ejecución", width: 110 },
  { key: "oc", label: "OC", width: 130 },
  { key: "fc", label: "FC", width: 130 },
  { key: "fechaActualizacion", label: "Fecha actualización", width: 110 },
  { key: "estado", label: "Estado", width: 110 },
  { key: "nota", label: "Nota", width: 220 },
];

function filaVacia() {
  const f = { id: uid() };
  COLUMNS.forEach((c) => { f[c.key] = ""; });
  return f;
}

/* Heurística de mapeo de encabezados: tolerante a años distintos en el
   título de la columna y a las erratas reales de la planilla
   ("APOBACION", "fecha actalizacion"). Se evalúa en este orden porque
   los campos con "fecha" tienen que capturarse antes que sus
   contrapartes sin fecha (ej. "fecha aprobación" antes que "aprobación"). */
function detectarColumna(headerNorm) {
  const h = headerNorm;
  if (h === "ppto") return "ppto";
  if (h === "cta") return "cta";
  if (h.includes("eventual")) return "descripcion";
  if (h === "edificio") return "edificio";
  if (h.includes("referente")) return "referente";
  if (h.includes("recepcion")) return "fechaRecepcion";
  if (h.includes("envio")) return "fechaEnvio";
  if (h === "mes") return "mes";
  if (h.includes("monto")) return "montoSIva";
  if (h.includes("fecha") && (h.includes("aprobac") || h.includes("apobac"))) return "fechaAprobacion";
  if (h.includes("aprobac") || h.includes("apobac")) return "aprobacion";
  if (h.includes("fecha") && h.includes("ejecuc")) return "fechaEjecucion";
  if (h.includes("ejecuc")) return "ejecucion";
  if (h === "oc") return "oc";
  if (h === "fc") return "fc";
  if (h.includes("actualiz") || h.includes("actaliz")) return "fechaActualizacion";
  // Estado y Nota son columnas separadas en la planilla real (antes se
  // confundían en un solo campo y la columna "Nota" quedaba pisada por
  // "Estado"). Si algún archivo viejo trae un único encabezado combinado
  // ("Estado / Nota"), cae en "estado" igual, sin perder información.
  if (h.includes("estado")) return "estado";
  if (h.includes("nota")) return "nota";
  return null;
}

const CAMPOS_FECHA = new Set(["fechaRecepcion", "fechaEnvio", "fechaAprobacion", "fechaEjecucion", "fechaActualizacion"]);

/* Unifica los errores de tipeo más comunes del campo Estado (mayúsculas,
   minúsculas, espacios) para que "Pendiente", "pendiente" y "PENDIENTE"
   cuenten y filtren como un solo valor: "PENDIENTE". Cualquier otro texto
   (por ejemplo una nota mal cargada en esta columna) se deja tal cual está,
   sin tocarle las mayúsculas, para no inventar datos que no puso nadie. */
function normalizarEstado(v) {
  const t = String(v || "").trim();
  if (!t) return "";
  const up = t.toUpperCase();
  if (up.includes("PENDIENTE")) return "PENDIENTE";
  if (up.includes("FINALIZAD")) return "FINALIZADO";
  if (up.includes("ANULAD")) return "ANULADO";
  return t;
}

/* ---------------------------------------------------------
   DEDUPLICACIÓN DE EVENTUALES
   Un mismo eventual puede volver a aparecer al reimportar la planilla
   compartida (porque alguien la modificó). No nos interesa guardar el
   historial de esos duplicados: solo la versión más actualizada. Se
   identifica un eventual por Ppto + Cta + Eventual + Edificio, y ante
   dos filas con la misma clave se conserva la primera del arreglo (por
   eso, al fusionar, las filas recién importadas van siempre primero).
--------------------------------------------------------- */
function claveEventual(r) {
  return ["ppto", "cta", "descripcion", "edificio"]
    .map((k) => String((r && r[k]) || "").trim().toUpperCase())
    .join("|");
}
function dedupeFilas(filas) {
  const vistos = new Set();
  const resultado = [];
  filas.forEach((r) => {
    const clave = claveEventual(r);
    // Filas sin ningún dato clave (todas vacías) no se consideran duplicadas entre sí.
    if (clave === "|||") { resultado.push(r); return; }
    if (vistos.has(clave)) return;
    vistos.add(clave);
    resultado.push(r);
  });
  return resultado;
}

/* Lee un workbook y arma filas a partir ÚNICAMENTE de la hoja
   "Eventuales Claro" (sin importar mayúsculas, acentos o espacios de
   más). El resto de las hojas del archivo (padrón de edificios, tablas
   dinámicas, hojas de trabajo, etc.) se ignoran siempre, aunque su
   encabezado llegue a "parecerse" al de eventuales. */
function esHojaEventualesClaro(nombreHoja) {
  return normalizeHeader(nombreHoja) === "eventuales claro";
}
function parseWorkbookClaro(workbook) {
  const filasTotales = [];
  const hojasUsadas = [];
  const nombreObjetivo = workbook.SheetNames.find(esHojaEventualesClaro);
  const hojasAProcesar = nombreObjetivo ? [nombreObjetivo] : [];
  hojasAProcesar.forEach((nombreHoja) => {
    const sheet = workbook.Sheets[nombreHoja];
    const matriz = XLSX.utils.sheet_to_json(sheet, { header: 1, raw: true, defval: "" });
    // Busca, entre las primeras filas, la que más columnas conocidas mapea.
    let mejorFila = -1, mejorMapa = null, mejorScore = 0;
    for (let i = 0; i < Math.min(matriz.length, 8); i++) {
      const fila = matriz[i];
      if (!fila || !fila.some((c) => String(c || "").trim())) continue;
      const mapa = {};
      let score = 0;
      fila.forEach((celda, idx) => {
        const campo = detectarColumna(normalizeHeader(celda));
        if (campo && !(campo in mapa)) { mapa[campo] = idx; score++; }
      });
      if (score > mejorScore) { mejorScore = score; mejorFila = i; mejorMapa = mapa; }
    }
    // Umbral: al menos descripción + 5 campos más reconocidos para
    // considerar que esta hoja es realmente una planilla de eventuales.
    if (mejorScore < 6 || !mejorMapa || mejorMapa.descripcion === undefined) return;
    hojasUsadas.push(nombreHoja);
    for (let i = mejorFila + 1; i < matriz.length; i++) {
      const fila = matriz[i];
      if (!fila || !fila.some((c) => String(c || "").trim())) continue;
      const nueva = filaVacia();
      Object.entries(mejorMapa).forEach(([campo, idx]) => {
        let v = fila[idx];
        if (v === undefined || v === null) v = "";
        if (CAMPOS_FECHA.has(campo)) v = excelSerialToISO(v);
        else if (typeof v === "number") v = String(v);
        nueva[campo] = campo === "estado" ? normalizarEstado(v) : String(v).trim();
      });
      // Solo se considera un eventual real cuando la fila tiene descripción.
      // El Ppto puede faltar (eventual todavía sin número asignado) y aun
      // así se importa, con ese campo en blanco para completarlo a mano
      // después. Lo que sí se sigue descartando son los renglones
      // precargados que solo tienen un número de Ppto y nada más (sin
      // ningún otro dato real cargado).
      if (!nueva.descripcion) continue;
      filasTotales.push(nueva);
    }
  });
  return { filas: filasTotales, hojas: hojasUsadas };
}

/* ---------------------------------------------------------
   BADGE DE ESTADO
--------------------------------------------------------- */
const ESTADO_COLORS = {
  "PENDIENTE": { bg: C.orangeSoft, fg: C.orange },
  "FINALIZADO": { bg: C.tealSoft, fg: C.teal },
  "ANULADO": { bg: C.roseSoft, fg: C.rose },
};
function colorParaEstado(v) {
  const key = String(v || "").trim().toUpperCase();
  if (ESTADO_COLORS[key]) return ESTADO_COLORS[key];
  if (key.includes("FINALIZADO")) return { bg: C.tealSoft, fg: C.teal };
  if (key.includes("ANULA")) return { bg: C.roseSoft, fg: C.rose };
  if (key.includes("PENDIENTE")) return { bg: C.orangeSoft, fg: C.orange };
  if (!key) return { bg: "rgba(0,0,0,0.05)", fg: C.textMuted };
  return { bg: C.blueSoft, fg: C.blue };
}

function Card({ children, className = "", style = {} }) {
  return (
    <div className={`rounded-2xl ${className}`} style={{ backgroundColor: C.card, border: `1px solid ${C.border}`, ...style }}>
      {children}
    </div>

}

function KPI({ label, value, accent, onClick }) {
  const clickable = typeof onClick === "function";
  return (
    <Card className={`p-4 sm:p-5 min-w-0 transition-transform ${clickable ? "cursor-pointer hover:-translate-y-0.5" : ""}`}>
      {clickable ? (
        <button onClick={onClick} className="w-full text-left" style={{ background: "none", border: "none", padding: 0, cursor: "pointer" }}>
          <div className="text-[11px] sm:text-xs font-semibold tracking-wide uppercase mb-1.5 truncate" style={{ color: C.textMuted }}>{label}</div>

        </button>
      ) : (

        </React.Fragment>

}

/* Celda editable: input controlado localmente, y recién avisa al padre
   (que guarda en Supabase) al perder el foco, para no disparar un
   guardado por cada tecla. */
function CeldaEditable({ value, onCommit, mono }) {
  const [val, setVal] = useState(value || "");
  useEffect(() => { setVal(value || ""); }, [value]);
  return (
    <input
      value={val}
      onChange={(e) => setVal(e.target.value)}
      onBlur={() => { if (val !== (value || "")) onCommit(val); }}
      style={{ fontFamily: mono ? "monospace" : "inherit" }}
    />
  );
}

/* ---------------------------------------------------------
   COMPONENTE PRINCIPAL
--------------------------------------------------------- */
function App() {
  const [rows, setRows] = useState([]);
  const [lastUpload, setLastUpload] = useState(null);
  const [sheetUrl, setSheetUrl] = useState("");
  const [loaded, setLoaded] = useState(false);
  const [error, setError] = useState("");
  const [busy, setBusy] = useState(false);
  const [refreshing, setRefreshing] = useState(false);
  const [lastSync, setLastSync] = useState(null);

  const [busqueda, setBusqueda] = useState("");
  const [fEstado, setFEstado] = useState("");
  const [fEdificio, setFEdificio] = useState("");

  const [showInfoPanel, setShowInfoPanel] = useState(false);
  const [showResetConfirm, setShowResetConfirm] = useState(false);
  const [dupMensaje, setDupMensaje] = useState("");
  const [showImportConfirm, setShowImportConfirm] = useState(false);
  const [pendingImport, setPendingImport] = useState(null);
  const [importMode, setImportMode] = useState("reemplazar"); // reemplazar | agregar
  const [showSheetConfig, setShowSheetConfig] = useState(false);
  const [sheetUrlDraft, setSheetUrlDraft] = useState("");
  const filesInputRef = useRef(null);
  const jsonInputRef = useRef(null);

  const refreshShared = useCallback(async (manual) => {
    if (manual) setRefreshing(true);
    try {
      const parsed = await storageGet();
      if (parsed) {
        setRows(parsed.rows || []);
        setLastUpload(parsed.lastUpload || null);
        setSheetUrl(parsed.sheetUrl || "");
      }
      setLastSync(new Date());
    } finally {
      if (manual) setRefreshing(false);
    }
  }, []);

  useEffect(() => {
    (async () => {
      const parsed = await storageGet();
      if (parsed) {
        setRows(parsed.rows || []);
        setLastUpload(parsed.lastUpload || null);
        setSheetUrl(parsed.sheetUrl || "");
      }
      setLastSync(new Date());
      setLoaded(true);
    })();
  }, []);

  useEffect(() => {
    const interval = setInterval(() => refreshShared(false), 15000);
    return () => clearInterval(interval);
  }, [refreshShared]);

  const persist = useCallback(async (patch) => {
    const ok = await storageSet({
      rows: patch.rows !== undefined ? patch.rows : rows,
      lastUpload: patch.lastUpload !== undefined ? patch.lastUpload : lastUpload,
      sheetUrl: patch.sheetUrl !== undefined ? patch.sheetUrl : sheetUrl,
    });
    if (!ok) setError("No se pudo guardar en la base compartida. Probá de nuevo en unos segundos.");
  }, [rows, lastUpload, sheetUrl]);

  const actualizarCelda = useCallback((id, campo, valor) => {
    setRows((prev) => {
      const valorFinal = campo === "estado" ? normalizarEstado(valor) : valor;
      const next = prev.map((r) => (r.id === id ? { ...r, [campo]: valorFinal } : r));
      persist({ rows: next });
      return next;
    });
  }, [persist]);

  const agregarFila = useCallback(() => {
    setRows((prev) => {
      const next = [filaVacia(), ...prev];
      persist({ rows: next });
      return next;
    });
  }, [persist]);

  const eliminarFila = useCallback((id) => {
    setRows((prev) => {
      const next = prev.filter((r) => r.id !== id);
      persist({ rows: next });
      return next;
    });
  }, [persist]);

  const handleFiles = useCallback(async (fileList) => {
    setError("");
    setBusy(true);
    try {
      const file = fileList[0];
      const buf = await file.arrayBuffer();
      const workbook = XLSX.read(buf, { type: "array", cellDates: false });
      const { filas, hojas } = parseWorkbookClaro(workbook);
      if (filas.length === 0) {
        throw new Error("No se encontró una hoja llamada \"Eventuales Claro\" con el formato esperado (Ppto, Eventual, Edificio, Referente, ...).");
      }
      setPendingImport({ filas, hojas, nombreArchivo: file.name });
      setShowImportConfirm(true);
    } catch (e) {
      setError(e.message || "No se pudo leer el archivo.");
    } finally {
      setBusy(false);
    }
  }, []);

  const handleFetchFromSheet = useCallback(async () => {
    setError("");
    if (!sheetUrl) { setShowSheetConfig(true); return; }
    const id = extraerIdGoogleSheet(sheetUrl);
    if (!id) { setError("El link de Google Sheets configurado no parece válido."); return; }
    setBusy(true);
    try {
      const res = await fetch(sheetExportUrl(id));
      if (!res.ok) throw new Error(`Google respondió con error ${res.status}.`);
      const buf = await res.arrayBuffer();
      const workbook = XLSX.read(buf, { type: "array", cellDates: false });
      const { filas, hojas } = parseWorkbookClaro(workbook);
      if (filas.length === 0) {
        throw new Error("Se pudo descargar el archivo pero no se encontró una hoja llamada \"Eventuales Claro\" con el formato esperado.");
      }
      setPendingImport({ filas, hojas, nombreArchivo: "Google Sheets (actualización automática)" });
      setShowImportConfirm(true);
    } catch (e) {
      setError(
        "No se pudo traer los datos desde Google Sheets. Lo más probable es que la hoja no esté compartida como " +
        "\"Cualquiera con el link puede ver\" (Google bloquea la descarga si no). Revisá el permiso de la hoja, o " +
        "seguí usando \"Cargar Excel\" mientras tanto. Detalle: " + (e.message || "error desconocido")
      );
    } finally {
      setBusy(false);
    }
  }, [sheetUrl]);

  const guardarSheetUrl = useCallback(async () => {
    const limpio = sheetUrlDraft.trim();
    setSheetUrl(limpio);
    await persist({ sheetUrl: limpio });
    setShowSheetConfig(false);
  }, [sheetUrlDraft, persist]);

  const confirmarImport = useCallback(async () => {
    if (!pendingImport) return;
    const nuevaFecha = todayISO();
    // Las filas recién importadas van primero para que, ante un eventual
    // repetido, prevalezca siempre la información más actualizada.
    const next = importMode === "agregar"
      ? dedupeFilas([...pendingImport.filas, ...rows])
      : pendingImport.filas;
    setRows(next);
    setLastUpload(nuevaFecha);
    await persist({ rows: next, lastUpload: nuevaFecha });
    setShowImportConfirm(false);
    setPendingImport(null);
  }, [pendingImport, importMode, rows, persist]);

  const quitarDuplicados = useCallback(async () => {
    setRows((prev) => {
      const next = dedupeFilas(prev);
      const eliminados = prev.length - next.length;
      setDupMensaje(
        eliminados > 0
          ? `Se eliminaron ${eliminados} registro${eliminados === 1 ? "" : "s"} duplicado${eliminados === 1 ? "" : "s"}.`
          : "No se encontraron registros duplicados."
      );
      if (eliminados > 0) persist({ rows: next });
      return next;
    });
  }, [persist]);

  const normalizarEstadosCargados = useCallback(async () => {
    setRows((prev) => {
      let cambios = 0;
      const next = prev.map((r) => {
        const norm = normalizarEstado(r.estado);
        if (norm !== (r.estado || "")) cambios++;
        return norm !== (r.estado || "") ? { ...r, estado: norm } : r;
      });
      setDupMensaje(
        cambios > 0
          ? `Se unificaron ${cambios} estado${cambios === 1 ? "" : "s"} con mayúsculas o espacios distintos (Pendiente/PENDIENTE, Anulado/ANULADO, etc.).`
          : "Todos los estados ya estaban unificados."
      );
      if (cambios > 0) persist({ rows: next });
      return next;
    });
  }, [persist]);

  const resetAll = useCallback(async () => {
    setRows([]);
    setLastUpload(null);
    setShowResetConfirm(false);
    const ok = await storageSet({ rows: [], lastUpload: null, sheetUrl });
    if (!ok) setError("No se pudo reiniciar la base compartida.");
  }, [sheetUrl]);

  const exportJSON = () => {
    const payload = { exportedAt: new Date().toISOString(), rows, lastUpload };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `Eventuales_Claro_Backup_${todayISO()}.json`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };

  const handleImportJSONFile = async (file) => {
    setError("");
    try {
      const text = await file.text();
      const parsed = JSON.parse(text);
      if (!parsed || !Array.isArray(parsed.rows)) {
        throw new Error("El archivo no tiene el formato esperado (copia de seguridad exportada desde este mismo sistema).");
      }
      setRows(parsed.rows);
      setLastUpload(parsed.lastUpload || null);
      await persist({ rows: parsed.rows, lastUpload: parsed.lastUpload || null });
    } catch (e) {
      setError(e.message || "No se pudo leer el archivo de copia de seguridad.");
    }
  };

  const exportExcel = async () => {
    const data = rowsFiltradas.map((r) => {
      const out = {};
      COLUMNS.forEach((c) => { out[c.label] = r[c.key] || ""; });
      return out;
    });
    const ws = XLSX.utils.json_to_sheet(data);
    ws["!cols"] = COLUMNS.map((c) => ({ wch: Math.max(10, Math.round(c.width / 7)) }));
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Eventuales Claro");
    XLSX.writeFile(wb, `Eventuales_Claro_${todayISO()}.xlsx`);
  };

  const presupuestosDistintos = useMemo(() => {
    const set = new Set(rows.map((r) => (r.ppto || "").trim()).filter(Boolean));
    return set.size;
  }, [rows]);

  const edificios = useMemo(() => {
    const set = new Set(rows.map((r) => (r.edificio || "").trim()).filter(Boolean));
    return Array.from(set).sort();
  }, [rows]);

  const estados = useMemo(() => {
    const set = new Set(rows.map((r) => (r.estado || "").trim()).filter(Boolean));
    return Array.from(set).sort();
  }, [rows]);

  // Filtro de texto por columna (encabezado de la tabla) + orden ascendente/
  // descendente al hacer clic en el título de cada columna.
  const [colFiltros, setColFiltros] = useState({});
  const [sortConfig, setSortConfig] = useState({ key: null, dir: 1 });

  const actualizarColFiltro = useCallback((key, valor) => {
    setColFiltros((prev) => ({ ...prev, [key]: valor }));
  }, []);

  const handleSort = useCallback((key) => {
    setSortConfig((prev) => {
      if (prev.key !== key) return { key, dir: 1 };
      if (prev.dir === 1) return { key, dir: -1 };
      return { key: null, dir: 1 };
    });
  }, []);

  const NUM_KEYS = useMemo(() => new Set(["ppto", "cta", "montoSIva"]), []);
  const compararValores = useCallback((a, b, key) => {
    const va = a[key] || "";
    const vb = b[key] || "";
    if (NUM_KEYS.has(key)) {
      const na = parseFloat(String(va).replace(/[^0-9.,-]/g, "").replace(",", "."));
      const nb = parseFloat(String(vb).replace(/[^0-9.,-]/g, "").replace(",", "."));
      const fa = Number.isFinite(na) ? na : -Infinity;
      const fb = Number.isFinite(nb) ? nb : -Infinity;
      return fa - fb;
    }
    return String(va).localeCompare(String(vb), "es", { numeric: true, sensitivity: "base" });
  }, [NUM_KEYS]);

  const rowsFiltradas = useMemo(() => {
    let out = rows;
    if (fEdificio) out = out.filter((r) => (r.edificio || "") === fEdificio);
    if (fEstado) out = out.filter((r) => (r.estado || "") === fEstado);
    if (busqueda.trim()) {
      const q = busqueda.trim().toLowerCase();
      out = out.filter((r) => COLUMNS.some((c) => String(r[c.key] || "").toLowerCase().includes(q)));
    }
    Object.entries(colFiltros).forEach(([key, valor]) => {
      const q = String(valor || "").trim().toLowerCase();
      if (q) out = out.filter((r) => String(r[key] || "").toLowerCase().includes(q));
    });
    if (sortConfig.key) {
      out = [...out].sort((a, b) => compararValores(a, b, sortConfig.key) * sortConfig.dir);
    }
    return out;
  }, [rows, fEdificio, fEstado, busqueda, colFiltros, sortConfig, compararValores]);

  const estadoCounts = useMemo(() => {
    const counts = {};
    rows.forEach((r) => { const e = (r.estado || "").trim() || "Sin estado"; counts[e] = (counts[e] || 0) + 1; });
    return Object.entries(counts).sort((a, b) => b[1] - a[1]);
  }, [rows]);

  const montoTotal = useMemo(() => {
    return rows.reduce((acc, r) => {
      const n = Number(String(r.montoSIva || "").replace(/[^0-9.,-]/g, "").replace(",", "."));
      return acc + (Number.isFinite(n) ? n : 0);
    }, 0);
  }, [rows]);

  const ultimaActualizacion = useMemo(() => {
    if (!lastUpload) return null;
    const [y, m, day] = lastUpload.split("-");
    return `${day}/${m}/${y}`;
  }, [lastUpload]);

  if (!loaded) {
    return <div className="flex items-center justify-center h-64" style={{ color: C.textMuted }}>Cargando base de control...</div>;
  }

  return (
    <div style={{ fontFamily: "'Inter', system-ui, sans-serif", minHeight: "100vh" }} className="px-4 sm:px-6 pt-5 sm:pt-6 pb-10">

      <input ref={filesInputRef} type="file" accept=".xlsx,.xls" className="hidden"
        onChange={(e) => { if (e.target.files && e.target.files.length) handleFiles(e.target.files); e.target.value = ""; }} />
      <input ref={jsonInputRef} type="file" accept=".json" className="hidden"
        onChange={(e) => { const f = e.target.files?.[0]; if (f) handleImportJSONFile(f); e.target.value = ""; }} />

      {/* ENCABEZADO */}
      <div className="flex items-center justify-between gap-3 mb-1 flex-wrap">
        <div className="flex items-center gap-3 flex-wrap">
          <div className="w-10 h-10 rounded-xl flex items-center justify-center flex-shrink-0 overflow-hidden" style={{ background: "#FFFFFF", border: `1px solid ${C.border}` }}>
            <img src={CLARO_LOGO} alt="Claro" className="w-full h-full object-contain" />
          </div>
          <div>
            <h1 className="text-lg sm:text-xl font-extrabold tracking-tight leading-tight" style={{ color: C.textLight }}>CONTROL DE VENTAS</h1>
            <p className="text-xs sm:text-sm" style={{ color: C.textMuted }}>Eventuales Claro (AMX)</p>
          </div>

          {/* Acciones: mismos cinco botones que Telefónica, más sincronización con Google Sheets */}
          <div className="flex items-center gap-1.5 ml-2">
            <button onClick={() => filesInputRef.current?.click()} disabled={busy}
              title={busy ? "Procesando..." : "Cargar Excel"}
              className="p-2.5 rounded-xl" style={{ background: `linear-gradient(135deg, ${C.primary}, ${C.violet})`, color: "#FFFFFF", opacity: busy ? 0.6 : 1 }}>
              <IconUpload size={16} />
            </button>
            <button onClick={handleFetchFromSheet} disabled={busy}
              title={sheetUrl ? (busy ? "Actualizando..." : "Actualizar desde Google Sheets") : "Configurar link de Google Sheets"}
              className="p-2.5 rounded-xl" style={{ background: `linear-gradient(135deg, #4285F4, #1A56C4)`, color: "#FFFFFF", opacity: busy ? 0.6 : 1 }}>
              <IconCloud size={16} />
            </button>
            <button onClick={agregarFila} title="Agregar fila"
              className="p-2.5 rounded-xl" style={{ backgroundColor: C.cardAlt, color: C.textLight, border: `1px solid ${C.border}` }}>
              <IconPlus size={16} />
            </button>
            <button onClick={exportExcel} title="Exportar a Excel"
              className="p-2.5 rounded-xl" style={{ background: `linear-gradient(135deg, ${C.teal}, #1F6B41)`, color: "#FFFFFF" }}>
              <IconDownload size={16} />
            </button>
            <button onClick={exportJSON} title="Guardar copia (JSON)"
              className="p-2.5 rounded-xl" style={{ backgroundColor: C.cardAlt, color: C.textLight, border: `1px solid ${C.border}` }}>
              <IconSave size={16} />
            </button>
            <button onClick={() => jsonInputRef.current?.click()} title="Restaurar copia (JSON)"
              className="p-2.5 rounded-xl" style={{ backgroundColor: C.cardAlt, color: C.textLight, border: `1px solid ${C.border}` }}>
              <IconFileUp size={16} />
            </button>
            <button onClick={quitarDuplicados} title="Quitar eventuales duplicados"
              className="p-2.5 rounded-xl" style={{ backgroundColor: C.cardAlt, color: C.textLight, border: `1px solid ${C.border}` }}>
              <IconLayers size={16} />
            </button>
            <button onClick={normalizarEstadosCargados} title="Unificar mayúsculas de Estado (Pendiente / PENDIENTE / pendiente → PENDIENTE)"
              className="p-2.5 rounded-xl" style={{ backgroundColor: C.cardAlt, color: C.textLight, border: `1px solid ${C.border}` }}>
              <IconSparkles size={16} />
            </button>
            <button onClick={() => setShowResetConfirm(true)} title="Reiniciar base de control"
              className="p-2.5 rounded-xl" style={{ backgroundColor: C.roseSoft, color: C.rose }}>
              <IconTrash size={16} />
            </button>
          </div>
        </div>

        <div className="flex items-center gap-2">
          <button onClick={() => refreshShared(true)} disabled={refreshing}
            title={lastSync ? `Última actualización: ${lastSync.toLocaleTimeString("es-AR")}` : "Actualizar"}
            className="flex items-center gap-1.5 px-2.5 py-2.5 rounded-xl text-sm font-semibold"
            style={{ backgroundColor: C.cardAlt, color: C.textLight, border: `1px solid ${C.border}`, opacity: refreshing ? 0.6 : 1 }}>
            <IconRefresh size={15} className={refreshing ? "spin-icon" : ""} />
          </button>
          <button onClick={() => setShowInfoPanel(true)} title="Información"
            className="flex items-center gap-1.5 px-3 py-2.5 rounded-xl text-sm font-semibold"
            style={{ border: `1px solid ${C.border}`, backgroundColor: C.card, color: C.textLight }}>
            <IconInfo size={16} />
          </button>
        </div>
      </div>
      {ultimaActualizacion && <div className="text-xs mb-3" style={{ color: C.textMuted }}>Última carga: {ultimaActualizacion}</div>}
      <div className="text-[10px] mb-3" style={{ color: C.textMuted, opacity: 0.6 }}>Versión del sistema: v2026-09-04 (solo hoja "Eventuales Claro", Estado y Nota como campos separados, requiere solo descripción)</div>
      <div className="mb-2" />

      {error && (
        <div className="mb-4 px-4 py-3 rounded-xl text-sm flex items-center justify-between" style={{ backgroundColor: C.roseSoft, color: C.rose }}>
          <span className="flex items-center gap-2"><IconAlert size={16} /> {error}</span>
          <button onClick={() => setError("")}><IconX size={16} /></button>
        </div>
      )}

      {dupMensaje && (
        <div className="mb-4 px-4 py-3 rounded-xl text-sm flex items-center justify-between" style={{ backgroundColor: C.tealSoft, color: C.teal }}>

      {/* KPIs */}
      <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-3 mb-4">

      <div className="text-[11px] mb-4" style={{ color: C.textMuted }}>

                <button key={estado} onClick={() => setFEstado(estado === "Sin estado" ? "" : estado)}

                  <span className="truncate">{estado}</span>
                  <span className="flex-shrink-0 ml-2">{count}</span>
                </button>
              );
            })}
          </div>
        )}
      </Card>

      {/* FILTROS */}
      <div className="flex flex-col sm:flex-row gap-2 mb-4 flex-wrap">
        <div className="flex-1 min-w-[200px] relative">
          <IconSearch size={15} className="absolute left-3 top-1/2 -translate-y-1/2" color={C.textMuted} />
          <input value={busqueda} onChange={(e) => setBusqueda(e.target.value)} placeholder="Buscar en cualquier campo..."
            className="w-full pl-9 pr-3 py-2.5 rounded-xl text-sm outline-none"
            style={{ border: `1px solid ${C.border}`, backgroundColor: C.card, color: C.textLight }} />
        </div>
        <select value={fEdificio} onChange={(e) => setFEdificio(e.target.value)}
          className="px-3 py-2.5 rounded-xl text-sm outline-none" style={{ border: `1px solid ${C.border}`, backgroundColor: C.card, color: C.textLight }}>
          <option value="">Todos los edificios</option>
          {edificios.map((e) => <option key={e} value={e}>{e}</option>)}
        </select>
        <select value={fEstado} onChange={(e) => setFEstado(e.target.value)}
          className="px-3 py-2.5 rounded-xl text-sm outline-none" style={{ border: `1px solid ${C.border}`, backgroundColor: C.card, color: C.textLight }}>
          <option value="">Todos los estados</option>
          {estados.map((e) => <option key={e} value={e}>{e}</option>)}
        </select>
        {(busqueda || fEdificio || fEstado) && (
          <button onClick={() => { setBusqueda(""); setFEdificio(""); setFEstado(""); }}
            className="px-3 py-2.5 rounded-xl text-sm font-semibold" style={{ backgroundColor: C.cardAlt, color: C.textLight }}>
            Limpiar filtros
          </button>
        )}
      </div>

      {/* TABLA EDITABLE */}
      <Card className="overflow-hidden mb-6">
        <div className="overflow-x-auto max-h-[65vh] overflow-y-auto">
          <table className="w-full text-sm grid-editable">
            <thead style={{ backgroundColor: C.cardAlt, position: "sticky", top: 0, zIndex: 1 }}>
              <tr>
                {COLUMNS.map((c) => {
                  const activo = sortConfig.key === c.key;
                  return (
                    <th key={c.key} className="text-left px-2 pt-2.5 pb-1 font-semibold text-xs uppercase tracking-wide whitespace-nowrap" style={{ color: C.textMuted, minWidth: c.width }}>
                      <button onClick={() => handleSort(c.key)}
                        className="flex items-center gap-1 hover:opacity-80"
                        style={{ color: activo ? C.primary : C.textMuted, background: "none", border: "none", padding: 0, cursor: "pointer", font: "inherit" }}
                        title="Ordenar por esta columna">
                        <span>{c.label}</span>
                        {activo ? (sortConfig.dir === 1 ? <IconArrowUp size={12} /> : <IconArrowDown size={12} />) : <IconArrowsUpDown size={12} style={{ opacity: 0.35 }} />}
                      </button>
                    </th>
                  );
                })}
                <th className="text-left px-2 pt-2.5 pb-1 font-semibold text-xs uppercase tracking-wide" style={{ color: C.textMuted }}></th>
              </tr>
              <tr>
                {COLUMNS.map((c) => (
                  <th key={c.key} className="px-2 pb-2" style={{ minWidth: c.width }}>
                    <input value={colFiltros[c.key] || ""} onChange={(e) => actualizarColFiltro(c.key, e.target.value)}
                      placeholder="Filtrar..."
                      className="w-full px-2 py-1 rounded-lg text-[11px] font-normal normal-case outline-none"
                      style={{ border: `1px solid ${C.border}`, backgroundColor: C.card, color: C.textLight }} />
                  </th>
                ))}
                <th className="px-2 pb-2">
                  {Object.values(colFiltros).some((v) => v && v.trim()) && (
                    <button onClick={() => setColFiltros({})} title="Limpiar filtros de columnas"
                      className="p-1.5 rounded-md hover:opacity-80" style={{ color: C.textMuted, backgroundColor: C.card, border: `1px solid ${C.border}` }}>
                      <IconX size={12} />
                    </button>
                  )}
                </th>
              </tr>
            </thead>
            <tbody>
              {rowsFiltradas.length === 0 && (
                <tr><td colSpan={COLUMNS.length + 1} className="px-4 py-10 text-center" style={{ color: C.textMuted }}>
                  {rows.length === 0
                    ? "Sin eventuales cargados todavía. Usá \"Cargar Excel\" para importar la planilla, o \"Agregar fila\" para empezar a mano."
                    : "Ningún resultado con estos filtros."}
                </td></tr>
              )}
              {rowsFiltradas.map((r) => (
                <tr key={r.id} style={{ borderTop: `1px solid ${C.border}` }} className="hover:bg-black/[0.015] align-top">
                  {COLUMNS.map((c) => (
                    <td key={c.key} className="px-1 py-1" style={{ minWidth: c.width }}>
                      {c.key === "estado" ? (
                        <div style={{ backgroundColor: colorParaEstado(r[c.key]).bg, borderRadius: 6 }}>
                          <CeldaEditable value={r[c.key]} onCommit={(v) => actualizarCelda(r.id, c.key, v)} />
                        </div>
                      ) : (
                        <CeldaEditable value={r[c.key]} onCommit={(v) => actualizarCelda(r.id, c.key, v)}
                          mono={c.key === "oc" || c.key === "fc"} />
                      )}
                    </td>
                  ))}
                  <td className="px-1 py-1">
                    <button onClick={() => eliminarFila(r.id)} title="Eliminar fila"
                      className="p-1.5 rounded-md hover:opacity-80" style={{ color: C.rose, backgroundColor: C.roseSoft }}>
                      <IconTrash size={13} />
                    </button>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </Card>
      <div className="text-xs mb-6" style={{ color: C.textMuted }}>
        Mostrando {rowsFiltradas.length} de {rows.length} eventuales. Los cambios en cualquier celda se guardan solos al salir de ella.
      </div>

      {/* MODAL: confirmar importación */}
      {showImportConfirm && pendingImport && (
        <div className="fixed inset-0 flex items-center justify-center z-50 p-4" style={{ backgroundColor: "rgba(20,15,15,0.45)" }}>
          <Card className="p-6 max-w-md w-full">
            <div className="flex items-center gap-2 mb-3">
              <IconUpload size={18} color={C.primary} />
              <span className="font-bold text-sm" style={{ color: C.textLight }}>Confirmar importación</span>
            </div>
            <p className="text-sm mb-3" style={{ color: C.textMuted }}>
              Se encontraron <strong style={{ color: C.textLight }}>{pendingImport.filas.length}</strong> eventuales en
              {" "}{pendingImport.hojas.length === 1 ? `la hoja "${pendingImport.hojas[0]}"` : `las hojas: ${pendingImport.hojas.join(", ")}`} del
              archivo <strong style={{ color: C.textLight }}>{pendingImport.nombreArchivo}</strong>.
            </p>
            <div className="flex flex-col gap-2 mb-4">
              <label className="flex items-center gap-2 text-sm px-3 py-2.5 rounded-xl cursor-pointer" style={{ border: `1px solid ${importMode === "reemplazar" ? C.primary : C.border}`, backgroundColor: importMode === "reemplazar" ? C.primarySoft : "transparent" }}>
                <input type="radio" checked={importMode === "reemplazar"} onChange={() => setImportMode("reemplazar")} />
                <span style={{ color: C.textLight }}><strong>Reemplazar todo</strong> — borra los {rows.length} eventuales actuales y deja solo los de este archivo.</span>
              </label>
              <label className="flex items-center gap-2 text-sm px-3 py-2.5 rounded-xl cursor-pointer" style={{ border: `1px solid ${importMode === "agregar" ? C.primary : C.border}`, backgroundColor: importMode === "agregar" ? C.primarySoft : "transparent" }}>
                <input type="radio" checked={importMode === "agregar"} onChange={() => setImportMode("agregar")} />
                <span style={{ color: C.textLight }}><strong>Agregar como filas nuevas</strong> — conserva los {rows.length} actuales y suma estos arriba. Si un eventual ya estaba cargado (mismo Ppto, Cta, Eventual y Edificio), se actualiza con la información nueva en lugar de duplicarse.</span>
              </label>
            </div>
            <div className="flex gap-2 justify-end">
              <button onClick={() => { setShowImportConfirm(false); setPendingImport(null); }}
                className="px-4 py-2 rounded-xl text-sm font-semibold" style={{ backgroundColor: C.cardAlt, color: C.textLight }}>
                Cancelar
              </button>
              <button onClick={confirmarImport}
                className="px-4 py-2 rounded-xl text-sm font-semibold" style={{ background: `linear-gradient(135deg, ${C.primary}, ${C.violet})`, color: "#FFFFFF" }}>
                Confirmar
              </button>
            </div>
          </Card>
        </div>
      )}

      {/* MODAL: confirmar reinicio */}
      {showResetConfirm && (
        <div className="fixed inset-0 flex items-center justify-center z-50 p-4" style={{ backgroundColor: "rgba(20,15,15,0.45)" }}>
          <Card className="p-6 max-w-sm w-full">
            <div className="flex items-center gap-2 mb-3">
              <IconAlert size={18} color={C.rose} />
              <span className="font-bold text-sm" style={{ color: C.textLight }}>¿Reiniciar la base de control?</span>
            </div>
            <p className="text-sm mb-4" style={{ color: C.textMuted }}>
              Se van a borrar los {rows.length} eventuales cargados para todos los que usan este link. Esta acción no se puede deshacer.
              Si querés, primero tocá "Guardar copia (JSON)" para tener un respaldo.
            </p>
            <div className="flex gap-2 justify-end">
              <button onClick={() => setShowResetConfirm(false)} className="px-4 py-2 rounded-xl text-sm font-semibold" style={{ backgroundColor: C.cardAlt, color: C.textLight }}>Cancelar</button>
              <button onClick={resetAll} className="px-4 py-2 rounded-xl text-sm font-semibold" style={{ backgroundColor: C.rose, color: "#FFFFFF" }}>Sí, reiniciar</button>
            </div>
          </Card>
        </div>
      )}

      {/* MODAL: información */}
      {showInfoPanel && (
        <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center" style={{ backgroundColor: "rgba(20,15,15,0.45)" }} onClick={() => setShowInfoPanel(false)}>
          <div className="w-full sm:max-w-md sm:rounded-2xl rounded-t-2xl overflow-hidden" style={{ backgroundColor: C.card }} onClick={(e) => e.stopPropagation()}>
            <div className="px-5 py-4 flex items-center justify-between" style={{ borderBottom: `1px solid ${C.border}`, backgroundColor: C.cardAlt }}>
              <span className="font-bold text-sm flex items-center gap-2" style={{ color: C.textLight }}><IconInfo size={16} /> Información</span>
              <button onClick={() => setShowInfoPanel(false)}><IconX size={18} color={C.textMuted} /></button>
            </div>
            <div className="p-5 text-xs leading-relaxed" style={{ color: C.textMuted }}>
              Los datos se guardan en la base compartida configurada en esta página: cualquier persona que abra el link publicado ve y edita la misma base.
              {lastSync && <> Última actualización: <strong style={{ color: C.textLight }}>{lastSync.toLocaleTimeString("es-AR")}</strong>.</>}
              <br /><br />
              A diferencia del sistema de Telefónica, acá no hay detección automática de altas/modificaciones: esta es una planilla
              editable en vivo. Cada celda se guarda sola al salir de ella (botón "Agregar fila" para sumar un eventual a mano), y
              "Cargar Excel" te deja elegir si reemplazar todo o sumar filas nuevas. Al importar, solo se toman los datos de la
              hoja llamada "Eventuales Claro" del archivo — el resto de las hojas (padrones, tablas dinámicas, etc.) se ignora
              siempre.
              <br /><br />
              Recomendado: antes de hacer cambios grandes (una carga masiva o un reinicio), tocá <strong style={{ color: C.textLight }}>"Guardar copia (JSON)"</strong> y
              conservá ese archivo como respaldo.
              <br /><br />
              <strong style={{ color: C.textLight }}>Para instalarla como app en el celular:</strong> abrí este link desde el navegador del teléfono
              y elegí "Agregar a pantalla de inicio" desde el menú (⋮ o el botón de compartir).
              <br /><br />
              <strong style={{ color: C.textLight }}>Actualizar desde Google Sheets (ícono azul de nube):</strong> trae el archivo completo

              Solo funciona si la hoja está compartida como "Cualquiera con el link puede ver" — si Google la bloquea, seguí usando
              "Cargar Excel" con la descarga manual mientras tanto.

                <div className="mt-2 px-3 py-2 rounded-lg text-[11px] break-all" style={{ backgroundColor: C.cardAlt, color: C.textLight }}>{sheetUrl}</div>
              ) : (

                className="mt-2 text-xs font-semibold px-3 py-2 rounded-lg" style={{ backgroundColor: C.primarySoft, color: C.primary }}>
                {sheetUrl ? "Cambiar el link" : "Configurar el link"}
              </button>
            </div>
          </div>
        </div>
      )}

      {/* MODAL: configurar link de Google Sheets */}
      {showSheetConfig && (
        <div className="fixed inset-0 flex items-center justify-center z-50 p-4" style={{ backgroundColor: "rgba(20,15,15,0.45)" }}>
          <Card className="p-6 max-w-md w-full">
            <div className="flex items-center gap-2 mb-3">
              <IconCloud size={18} color="#4285F4" />
              <span className="font-bold text-sm" style={{ color: C.textLight }}>Link de Google Sheets</span>
            </div>
            <p className="text-sm mb-3" style={{ color: C.textMuted }}>
              Pegá el link completo de la hoja (el mismo que se ve en la barra de direcciones al tenerla abierta). Este link se
              guarda para todos los que usan la app.
            </p>
            <input value={sheetUrlDraft} onChange={(e) => setSheetUrlDraft(e.target.value)}
              placeholder="https://docs.google.com/spreadsheets/d/..."
              className="w-full px-3 py-2.5 rounded-xl text-sm outline-none mb-2"
              style={{ border: `1px solid ${C.border}`, backgroundColor: C.cardAlt, color: C.textLight }} />
            <p className="text-xs mb-4" style={{ color: C.textMuted }}>

            </p>
            <div className="flex gap-2 justify-end">
              <button onClick={() => setShowSheetConfig(false)} className="px-4 py-2 rounded-xl text-sm font-semibold" style={{ backgroundColor: C.cardAlt, color: C.textLight }}>Cancelar</button>
              <button onClick={guardarSheetUrl} className="px-4 py-2 rounded-xl text-sm font-semibold" style={{ background: `linear-gradient(135deg, #4285F4, #1A56C4)`, color: "#FFFFFF" }}>Guardar</button>
            </div>
          </Card>
        </div>
      )}

    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);

</script>
</body>
</html>
