   datos de seguimiento (R1/R2/historial), guardados bajo una clave

   con esta app. La navegación entre clientes se hace desde el panel

const CLIENTES = [

];
const CLIENTE_DEFAULT = CLIENTES[0].id;
const CLIENTE_KEY = "cliente_actual_v1"; // personal (guardado en este navegador, no compartido)

function clienteGetSync() {
  try {
    const url = new URL(window.location.href);
    const deUrl = url.searchParams.get("cliente");
    if (deUrl && CLIENTES.some((c) => c.id === deUrl.toUpperCase())) return deUrl.toUpperCase();
    const guardado = localStorage.getItem(CLIENTE_KEY);
    if (guardado && CLIENTES.some((c) => c.id === guardado)) return guardado;
  } catch (e) { /* noop */ }
  return CLIENTE_DEFAULT;
}
function clienteSet(id) {
  try {
    localStorage.setItem(CLIENTE_KEY, id);
    const url = new URL(window.location.href);
    url.searchParams.set("cliente", id);
    window.history.replaceState({}, "", url.toString());
  } catch (e) { /* noop */ }
}
function stateKeyPara(cliente) { return `estado_compartido__${cliente}`; }

async function storageGet(cliente) {
  const { data, error } = await supabaseClient
    .from("app_state").select("data").eq("key", stateKeyPara(cliente)).maybeSingle();
  if (error || !data) return null;
  const state = data.data || {};
  return {
    r1Base: state.r1Base || {},
    r2Base: state.r2Base || {},
    historial: state.historial || [],
    meta: state.meta || { lastR1: null, lastR2: null, lastR1UploadId: null, lastR2UploadId: null },
  };
}

async function storageSet(cliente, state) {
  const historialRecortado = (state.historial || []).slice(0, HISTORIAL_MAX);
  const payload = {
    r1Base: state.r1Base || {},
    r2Base: state.r2Base || {},
    historial: historialRecortado,
    meta: state.meta || {},
  };
  const { error } = await supabaseClient
    .from("app_state")
    .upsert({ key: stateKeyPara(cliente), data: payload, updated_at: new Date().toISOString() });
  if (error) console.error("storageSet", error);
  return !error;
}

/* ---------------------------------------------------------
   HELPERS
--------------------------------------------------------- */
function normVal(v) {
  if (v === null || v === undefined) return "";
  if (v instanceof Date) {
    if (isNaN(v.getTime())) return "";
    return v.toISOString().slice(0, 10);
  }
  if (typeof v === "number") {
    return Number.isInteger(v) ? String(v) : String(Math.round(v * 100) / 100);
  }
  return String(v).trim();
}
function fmtDisplay(v) { return (v === "" || v === null || v === undefined) ? "(vacío)" : v; }
function todayISO() { return new Date().toISOString().slice(0, 10); }
function uid() { return Math.random().toString(36).slice(2, 10) + Date.now().toString(36); }

/* ---------------------------------------------------------
   FILTROS EN CASCADA (estilo Excel): cada filtro sólo ofrece
   las opciones que siguen siendo posibles dados los demás
   filtros activos, y se puede limpiar cada uno individualmente.
--------------------------------------------------------- */
function rowMatchesFilters(row, defs, exceptKey) {
  return defs.every((d) => {
    if (d.key === exceptKey) return true;
    if (!d.value) return true;
    return d.test(row, d.value);
  });
}
function filterRowsCascade(rows, defs) {
  return rows.filter((row) => rowMatchesFilters(row, defs, null));
}
function optionsForCascade(rows, defs, key, get) {
  const subset = rows.filter((row) => rowMatchesFilters(row, defs, key));
  const s = new Set();
  subset.forEach((row) => { const v = get(row); if (v) s.add(v); });
  return Array.from(s).sort();
}

function findHeaderRowIndex(rows, keyLabels) {
  const limit = Math.min(rows.length, 10);
  for (let i = 0; i < limit; i++) {
    const row = rows[i] || [];
    const norm = row.map((c) => (c === null || c === undefined ? "" : String(c).trim()));
    if (keyLabels.some((k) => norm.includes(k))) return i;
  }
  return -1;
}

/* Busca, en TODAS las hojas del libro, la primera hoja que contenga alguna de
   las etiquetas clave (keyLabels) dentro de sus primeras filas, y devuelve en
   qué hoja y en qué fila está el encabezado. Esto es necesario porque el
   archivo real puede traer varias hojas (ej: "CM", "TA-EV_Final v1_2",
   "CuentaContablev2") y la hoja con los datos de tareas no es siempre la
   primera, y además el encabezado no siempre está en la fila 1. */
function findHeaderLocation(workbook, keyLabels) {
  for (const sheetName of workbook.SheetNames) {
    const ws = workbook.Sheets[sheetName];
    if (!ws) continue;
    const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: null, raw: true });
    const headerIdx = findHeaderRowIndex(rows, keyLabels);
    if (headerIdx !== -1) return { sheetName, rows, headerIdx };
  }
  return null;
}

function detectReportType(workbook) {
  const loc1 = findHeaderLocation(workbook, [R1_KEY]);
  const loc2 = findHeaderLocation(workbook, [R2_KEY]);
  if (loc1 && !loc2) return "r1";
  if (loc2 && !loc1) return "r2";
  if (loc1 && loc2) {
    const i1 = workbook.SheetNames.indexOf(loc1.sheetName);
    const i2 = workbook.SheetNames.indexOf(loc2.sheetName);
    if (i1 !== i2) return i1 < i2 ? "r1" : "r2";
    return loc1.headerIdx <= loc2.headerIdx ? "r1" : "r2";
  }
  return null;
}

function parseWorkbookRecords(workbook, keyLabels) {
  const loc = findHeaderLocation(workbook, keyLabels);
  if (!loc) {
    throw new Error("No se encontró una fila de encabezados con 'Código' o 'TA_Código' en ninguna hoja del archivo.");
  }
  const { rows, headerIdx } = loc;
  const headers = (rows[headerIdx] || []).map((h) => (h === null || h === undefined ? "" : String(h).trim()));
  const dataRows = rows.slice(headerIdx + 1).filter((r) => r && r.some((v) => v !== null && v !== "" && v !== undefined));
  return dataRows.map((r) => {
    const obj = {};
    headers.forEach((h, idx) => { if (h) obj[h] = r[idx]; });
    return obj;
  });
}

function processReport({ records, keyHeader, tracked, display, prevBase, uploadDate, uploadId, reportLabel }) {
  const newBase = { ...prevBase };
  const changes = [];
  for (const record of records) {
    const codigoRaw = record[keyHeader];
    if (codigoRaw === null || codigoRaw === undefined || String(codigoRaw).trim() === "") continue;
    const codigo = String(codigoRaw).trim();
    const prev = prevBase[codigo];
    const entry = { _updated: uploadDate };
    display.forEach((d) => (entry[d.key] = normVal(record[d.header])));
    tracked.forEach((f) => (entry[f.key] = normVal(record[f.header])));

    if (!prev) {
      changes.push({ id: uid(), fecha: uploadDate, uploadId, codigo, reporte: reportLabel, tipo: "Nuevo", campo: "—", anterior: "", nuevo: "Tarea agregada", proyecto: entry.proyecto || "" });
    } else {
      tracked.forEach((f) => {
        const oldV = prev[f.key] ?? "";
        const newV = entry[f.key] ?? "";
        if (oldV !== newV && !(oldV === "" && newV === "")) {
          changes.push({ id: uid(), fecha: uploadDate, uploadId, codigo, reporte: reportLabel, tipo: "Modificado", campo: f.label, anterior: fmtDisplay(oldV), nuevo: fmtDisplay(newV), proyecto: entry.proyecto || prev.proyecto || "" });
        }
      });
    }
    newBase[codigo] = { ...prev, ...entry };
  }
  return { newBase, changes };
}

/* Colores de relleno para el reporte de cambios (ExcelJS usa ARGB) */
const XLS_FILL = {
  amarilloClaro: "FFFFF2CC", // Valor anterior (todas las celdas)
  grisClaro: "FFD9D9D9",     // Valor nuevo (por defecto, sin estado reconocido)

/* Paleta de colores por estado para la columna "Valor nuevo"

const ESTADO_COLORS = {

  "aprobado": { bg: "59A14F", fg: "FFFFFF" },

  "completada": { bg: "3F8F46", fg: "FFFFFF" },
  "completado": { bg: "3F8F46", fg: "FFFFFF" },
  "confirmada": { bg: "5B9BD5", fg: "FFFFFF" },
  "confirmado": { bg: "5B9BD5", fg: "FFFFFF" },
  "desestimada": { bg: "6B7280", fg: "FFFFFF" },
  "desestimado": { bg: "6B7280", fg: "FFFFFF" },
  "en proceso": { bg: "F28E2B", fg: "20302A" },
  "enviada": { bg: "277DA1", fg: "FFFFFF" },
  "enviado": { bg: "277DA1", fg: "FFFFFF" },
  "facturada": { bg: "8FD694", fg: "20302A" },
  "facturado": { bg: "8FD694", fg: "20302A" },
  "rechazada": { bg: "E15759", fg: "FFFFFF" },
  "rechazado": { bg: "E15759", fg: "FFFFFF" },
};
function estadoColor(valor) {
  const v = String(valor || "").trim().toLowerCase();
  return ESTADO_COLORS[v] || null;
}

function fillCell(cell, argb, fontArgb) {
  cell.fill = { type: "pattern", pattern: "solid", fgColor: { argb } };
  if (fontArgb) cell.font = { ...(cell.font || {}), color: { argb: fontArgb } };
}

/* Reporte a Excel: SOLO la hoja de "Cambios detectados", con el
   formato de colores pedido (columna anterior en amarillo claro,
   columna nueva en gris claro salvo estados especiales). */
async function downloadCambiosWorkbook(rows, filename) {
  const wb = new ExcelJS.Workbook();
  const ws = wb.addWorksheet("Cambios detectados");

  const columns = [
    { header: "Fecha", key: "Fecha", width: 14 },
    { header: "Código", key: "Código", width: 16 },
    { header: "Proyecto", key: "Proyecto", width: 26 },
    { header: "Reporte", key: "Reporte", width: 12 },
    { header: "Tipo", key: "Tipo", width: 14 },
    { header: "Campo", key: "Campo", width: 28 },
    { header: "Valor anterior", key: "Valor anterior", width: 30 },
    { header: "Valor nuevo", key: "Valor nuevo", width: 30 },
  ];
  ws.columns = columns;
  ws.getRow(1).font = { bold: true };
  ws.getRow(1).eachCell((cell) => {
    cell.fill = { type: "pattern", pattern: "solid", fgColor: { argb: "FFE7EDE5" } };
  });
  ws.views = [{ state: "frozen", ySplit: 1 }];

  if (!rows.length) {
    ws.addRow({ Fecha: "", Código: "", Proyecto: "", Reporte: "", Tipo: "", Campo: "", "Valor anterior": "Sin cambios detectados", "Valor nuevo": "" });
  } else {
    rows.forEach((r) => {
      const row = ws.addRow(r);

      // Columna "Valor anterior": siempre amarillo claro
      fillCell(row.getCell("Valor anterior"), XLS_FILL.amarilloClaro);

      // Columna "Valor nuevo": color según estado (paleta ESTADO_COLORS),
      // gris claro por defecto si el estado no está en la paleta.
      const nuevoCell = row.getCell("Valor nuevo");
      const colors = estadoColor(r["Valor nuevo"]);
      if (colors) {
        fillCell(nuevoCell, "FF" + colors.bg, "FF" + colors.fg);
      } else {
        fillCell(nuevoCell, XLS_FILL.grisClaro);
      }
    });
  }

  const buffer = await wb.xlsx.writeBuffer();
  const blob = new Blob([buffer], { type: "application/octet-stream" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function useTableControls(rows, columns) {
  const [sort, setSort] = useState({ key: null, dir: null });
  const [colFilters, setColFilters] = useState({});
  const [openFilter, setOpenFilter] = useState(null);

  const toggleSort = useCallback((key) => {
    setSort((prev) => {
      if (prev.key !== key) return { key, dir: "asc" };
      if (prev.dir === "asc") return { key, dir: "desc" };
      return { key: null, dir: null };
    });
  }, []);

  const setColFilter = useCallback((key, value) => {
    setColFilters((f) => ({ ...f, [key]: value }));
  }, []);
  const clearColFilter = useCallback((key) => {
    setColFilters((f) => { const n = { ...f }; delete n[key]; return n; });
  }, []);
  const clearAllColFilters = useCallback(() => setColFilters({}), []);

  const processed = useMemo(() => {
    let out = rows;
    const activeKeys = Object.keys(colFilters).filter((k) => colFilters[k]);
    if (activeKeys.length) {
      out = out.filter((row) => activeKeys.every((key) => {
        const col = columns.find((c) => c.key === key);
        if (!col) return true;
        const cell = col.get(row);
        return String(cell ?? "").toLowerCase().includes(colFilters[key].toLowerCase());
      }));
    }
    if (sort.key) {
      const col = columns.find((c) => c.key === sort.key);
      if (col) {
        out = [...out].sort((a, b) => {
          let va = col.get(a); let vb = col.get(b);
          const na = Number(va); const nb = Number(vb);
          const bothNumeric = va !== "" && vb !== "" && va !== null && vb !== null && va !== undefined && vb !== undefined && !isNaN(na) && !isNaN(nb);
          if (bothNumeric) { va = na; vb = nb; }
          else { va = String(va ?? "").toLowerCase(); vb = String(vb ?? "").toLowerCase(); }
          if (va < vb) return sort.dir === "asc" ? -1 : 1;
          if (va > vb) return sort.dir === "asc" ? 1 : -1;
          return 0;
        });
      }
    }
    return out;
  }, [rows, colFilters, sort, columns]);

  const activeFilterCount = Object.values(colFilters).filter(Boolean).length;

  return { sort, toggleSort, colFilters, setColFilter, clearColFilter, clearAllColFilters, openFilter, setOpenFilter, processed, activeFilterCount };
}

function ThSortFilter({ col, ctl }) {
  const isSorted = ctl.sort.key === col.key;
  const isOpen = ctl.openFilter === col.key;
  const hasFilter = !!ctl.colFilters[col.key];
  const wrapRef = useRef(null);

  useEffect(() => {
    if (!isOpen) return;
    const onDocClick = (e) => {
      if (wrapRef.current && !wrapRef.current.contains(e.target)) ctl.setOpenFilter(null);
    };
    document.addEventListener("mousedown", onDocClick);
    return () => document.removeEventListener("mousedown", onDocClick);
  }, [isOpen, ctl]);

  return (
    <th ref={wrapRef} className="text-left px-4 py-2.5 font-semibold text-xs uppercase tracking-wide relative" style={{ color: C.textMuted }}>
      <div className="flex items-center gap-1.5">
        <span className="cursor-pointer flex items-center gap-1 select-none" onClick={() => ctl.toggleSort(col.key)} title="Ordenar">
          {col.header}
          {isSorted
            ? (ctl.sort.dir === "asc" ? <IconArrowUp size={11} color={C.primary} /> : <IconArrowDown size={11} color={C.primary} />)
            : <IconChevronsUpDown size={11} color={C.textMuted} />}
        </span>
        <button onClick={() => ctl.setOpenFilter(isOpen ? null : col.key)} title="Filtrar columna"
          className="p-0.5 rounded" style={{ color: hasFilter ? C.primary : C.textMuted }}>
          <IconFilter size={11} />
        </button>
      </div>
      {isOpen && (
        <div className="absolute z-20 top-full left-0 mt-1 p-2 rounded-lg shadow-lg normal-case" style={{ backgroundColor: C.card, border: `1px solid ${C.border}`, minWidth: 170, boxShadow: "0 8px 24px rgba(0,0,0,0.18)" }}>
          <input
            autoFocus
            value={ctl.colFilters[col.key] || ""}
            onChange={(e) => ctl.setColFilter(col.key, e.target.value)}
            onKeyDown={(e) => { if (e.key === "Enter") ctl.setOpenFilter(null); }}
            placeholder={`Filtrar ${col.header.toLowerCase()}...`}
            className="w-full text-xs font-normal rounded px-2 py-1.5 outline-none"
            style={{ border: `1px solid ${C.border}`, color: C.textLight, backgroundColor: C.cardAlt }}
          />
          <div className="flex justify-between mt-1.5">
            <button onClick={() => ctl.clearColFilter(col.key)} className="text-[11px] font-normal" style={{ color: C.textMuted }}>Limpiar</button>
            <button onClick={() => ctl.setOpenFilter(null)} className="text-[11px] font-semibold" style={{ color: C.primary }}>Aplicar</button>
          </div>
        </div>
      )}
    </th>
  );
}

function FieldRow({ label, value }) {

/* "Rama" del mapa mental: se conecta visualmente al nodo raíz (TA_Código)
   mediante una línea vertical + un círculo, y una flecha (›) que indica
   que estos campos pertenecen/derivan de ese código raíz — así se evita
   confundir QO/PO/FO con "otro número más" sin relación. */
function DetailBranch({ label, codigo, estado, color, children }) {
  const hasCodigo = codigo !== undefined && codigo !== null && String(codigo).trim() !== "";
  return (
    <div className="relative pl-5 pb-3">
      <span className="absolute left-0 top-0 bottom-0 w-0.5" style={{ backgroundColor: C.border }} />
      <span className="absolute -left-[5px] top-3 w-3 h-3 rounded-full border-2" style={{ backgroundColor: C.card, borderColor: color || C.primary }} />

        <div className="flex items-center justify-between gap-2 mb-1">
          <span className="text-xs font-bold uppercase tracking-wide flex items-center gap-1" style={{ color: C.textLight }}>
            <span style={{ color: color || C.primary }}>›</span> {label}
          </span>
          {estado !== undefined && <EstadoBadge estado={estado} />}
        </div>
        {codigo !== undefined && (
          <div className="font-mono text-xs mb-1" style={{ color: hasCodigo ? C.textLight : C.textMuted }}>
            {hasCodigo ? codigo : "Sin código asociado todavía"}
          </div>
        )}

      </div>
    </div>
  );
}

        setR1Base(parsed.r1Base || {});
        setR2Base(parsed.r2Base || {});
        setHistorial(parsed.historial || []);
        setMeta(parsed.meta || { lastR1: null, lastR2: null, lastR1UploadId: null, lastR2UploadId: null });
      }
      setLastSync(new Date());
    } finally {
      if (manual) setRefreshing(false);
    }
  }, [cliente]);

  // Carga inicial Y recarga completa cada vez que se cambia de cliente

  useEffect(() => {
    setLoaded(false);
    (async () => {
      const parsed = await storageGet(cliente);
      if (parsed) {
        setR1Base(parsed.r1Base || {});
        setR2Base(parsed.r2Base || {});
        setHistorial(parsed.historial || []);
        setMeta(parsed.meta || { lastR1: null, lastR2: null, lastR1UploadId: null, lastR2UploadId: null });
      } else {
        setR1Base({});
        setR2Base({});
        setHistorial([]);
        setMeta({ lastR1: null, lastR2: null, lastR1UploadId: null, lastR2UploadId: null });

  // Refresca datos compartidos periódicamente para reflejar cambios de otros usuarios

  const persist = useCallback(async (state) => {

  }, [cliente]);

  const handleFiles = useCallback(async (fileList) => {
    setError("");
    setBusy(true);
    try {
      let workingR1 = r1Base;
      let workingR2 = r2Base;
      const workingMeta = { ...meta };
      let allChanges = [];
      const summary = { r1: null, r2: null };
      const skipped = [];

      /* Identificador único de ESTA acción de carga (independiente de la
         fecha, que el usuario puede editar y repetir). "fecha" (uploadDate)
         sigue usándose tal cual para mostrar/filtrar en el historial; este
         id solo sirve para que las tarjetas KPI 3 y 4 puedan diferenciar
         la última carga de la anteúltima aunque compartan la misma fecha. */
      const uploadId = uid();

      for (const file of Array.from(fileList)) {
        const buf = await file.arrayBuffer();
        const workbook = XLSX.read(buf, { type: "array", cellDates: true });
        const type = detectReportType(workbook);

        if (type === "r1") {
          const records = parseWorkbookRecords(workbook, [R1_KEY]);
          const result = processReport({ records, keyHeader: R1_KEY, tracked: R1_TRACKED, display: R1_DISPLAY, prevBase: workingR1, uploadDate, uploadId, reportLabel: "Reporte 1" });
          workingR1 = result.newBase;
          workingMeta.lastR1 = uploadDate;
          workingMeta.lastR1UploadId = uploadId;
          allChanges = [...result.changes, ...allChanges];
          summary.r1 = { nuevos: result.changes.filter((c) => c.tipo === "Nuevo").length, modificados: result.changes.filter((c) => c.tipo === "Modificado").length };
        } else if (type === "r2") {
          const records = parseWorkbookRecords(workbook, [R2_KEY]);
          const result = processReport({ records, keyHeader: R2_KEY, tracked: R2_TRACKED, display: R2_DISPLAY, prevBase: workingR2, uploadDate, uploadId, reportLabel: "Reporte 2" });
          workingR2 = result.newBase;
          workingMeta.lastR2 = uploadDate;
          workingMeta.lastR2UploadId = uploadId;
          allChanges = [...result.changes, ...allChanges];
          summary.r2 = { nuevos: result.changes.filter((c) => c.tipo === "Nuevo").length, modificados: result.changes.filter((c) => c.tipo === "Modificado").length };
        } else {
          skipped.push(file.name);
        }
      }

      setR1Base(workingR1);
      setR2Base(workingR2);
      setMeta(workingMeta);
      const newHistorial = [...allChanges, ...historial];
      setHistorial(newHistorial);

      const parts = [];
      if (summary.r1) parts.push(`Reporte 1: ${summary.r1.nuevos} nuevas, ${summary.r1.modificados} modificadas`);
      if (summary.r2) parts.push(`Reporte 2: ${summary.r2.nuevos} nuevas, ${summary.r2.modificados} modificadas`);
      if (parts.length) {
        setAlertBanner({ message: `Carga procesada — ${parts.join(" · ")}.` });
      }
      if (skipped.length) {
        setError(`No se pudo identificar el tipo de reporte para: ${skipped.join(", ")}. Verificá que el archivo tenga la columna 'Código' (Reporte 1) o 'TA_Código' (Reporte 2).`);
      }

      await persist({ r1Base: workingR1, r2Base: workingR2, historial: newHistorial, meta: workingMeta });
    } catch (e) {
      setError(e.message || "Ocurrió un error al procesar los archivos.");
    } finally {
      setBusy(false);
    }
  }, [r1Base, r2Base, historial, meta, uploadDate, persist]);

  const cambiosQoEstados = useMemo(() => optionsForCascade(historialEnriquecido, cambiosFilterDefs, "qoEstado", (r) => r.qo_estado), [historialEnriquecido, cambiosFilterDefs]);
  const cambiosPoEstados = useMemo(() => optionsForCascade(historialEnriquecido, cambiosFilterDefs, "poEstado", (r) => r.po_estado), [historialEnriquecido, cambiosFilterDefs]);

  /* Agrupación de "Cambios detectados" por TA: se arma DESPUÉS de aplicar

  const cambiosAgrupados = useMemo(() => {
    const groups = new Map();
    cambiosCtl.processed.forEach((h) => {
      const key = `${h.reporte}::${h.codigo}`;
      if (!groups.has(key)) groups.set(key, { key, codigo: h.codigo, reporte: h.reporte, proyecto: h.proyecto, movimientos: [] });
      const g = groups.get(key);
      g.movimientos.push(h);
      if (h.proyecto) g.proyecto = h.proyecto;
    });
    const arr = Array.from(groups.values());
    arr.forEach((g) => {
      g.movimientos.sort((a, b) => (a.fecha < b.fecha ? -1 : a.fecha > b.fecha ? 1 : 0));
      g.ultimaFecha = g.movimientos[g.movimientos.length - 1].fecha;
      let estadoRelevante = "";
      for (let i = g.movimientos.length - 1; i >= 0; i--) {
        const m = g.movimientos[i];
        if (CAMPOS_ESTADO.includes(m.campo) && m.nuevo && m.nuevo !== "(vacío)") { estadoRelevante = m.nuevo; break; }
      }
      g.estadoRelevante = estadoRelevante;
    });
    arr.sort((a, b) => (a.ultimaFecha < b.ultimaFecha ? 1 : a.ultimaFecha > b.ultimaFecha ? -1 : 0));

  const [expandedCambios, setExpandedCambios] = useState(() => new Set());
  const toggleCambioExpand = useCallback((key) => {

    });
  }, []);
  /* Desde un grupo de cambios se puede abrir la ficha completa (mapa mental

  const r1Rows = useMemo(() => Object.entries(r1Base).map(([codigo, v]) => ({ codigo, ...v })), [r1Base]);

  const r1FilteredTop = useMemo(() => filterRowsCascade(r1Rows, r1FilterDefs), [r1Rows, r1FilterDefs]);

    { key: "qoEstado", value: b2QoEstado, get: (r) => r.qo_estado, test: (r, v) => r.qo_estado === v },

    { key: "busqueda", value: b2Busqueda, test: (r, v) => r.codigo.toLowerCase().includes(v.toLowerCase()) },
  ]), [b2Estado, b2Proyecto, b2QoEstado, b2PoEstado, b2Busqueda]);
  const r2Estados = useMemo(() => optionsForCascade(r2Rows, r2FilterDefs, "estado", (r) => r.estado), [r2Rows, r2FilterDefs]);
  const r2Proyectos = useMemo(() => optionsForCascade(r2Rows, r2FilterDefs, "proyecto", (r) => r.proyecto), [r2Rows, r2FilterDefs]);
  const r2QoEstados = useMemo(() => optionsForCascade(r2Rows, r2FilterDefs, "qoEstado", (r) => r.qo_estado), [r2Rows, r2FilterDefs]);
  const r2PoEstados = useMemo(() => optionsForCascade(r2Rows, r2FilterDefs, "poEstado", (r) => r.po_estado), [r2Rows, r2FilterDefs]);

    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `Control_Tareas_Backup_${cliente}_${todayISO()}.json`;

  };

        throw new Error("El archivo no tiene el formato esperado de copia de seguridad (JSON exportado desde este mismo sistema).");
      }

  const [mobileView, setMobileView] = useState("resumen");

  /* Alertas: derivadas exclusivamente de los datos ya cargados. */

  /* Se agrupa por Reporte+Código para que una misma tarea con varios

  const alertModsRecientes = useMemo(() => {

  const alertsWithData = alerts.filter((a) => a.count > 0);

  const getEstadoAlerta = useCallback((kind, r) => {

     meta.lastR2. Esta es la única fecha de referencia para las
     tarjetas 3 y 4 (y para los badges ALTA/MODIFICADO), indistintamente
     de a qué reporte pertenezca cada evento del historial. */
  const ultimaFechaCarga = useMemo(() => {
    const fechas = [meta.lastR1, meta.lastR2].filter(Boolean).sort();
    return fechas.length ? fechas[fechas.length - 1] : null;
  }, [meta.lastR1, meta.lastR2]);

  /* Códigos dados de alta o modificados en la ÚLTIMA carga (para mostrar
     el badge ALTA / MODIFICADO en las tarjetas móviles). Se filtra por
     "fecha" comparándola contra ultimaFechaCarga, el mismo criterio para
     Reporte 1 y Reporte 2 (no importa cuál de los dos reportes generó
     esa fecha como la más reciente). */
  const r1ModifiedLatest = useMemo(() => new Set(historial.filter((h) => h.reporte === "Reporte 1" && h.tipo === "Modificado" && ultimaFechaCarga != null && h.fecha === ultimaFechaCarga).map((h) => h.codigo)), [historial, ultimaFechaCarga]);
  const r1NewLatest = useMemo(() => new Set(historial.filter((h) => h.reporte === "Reporte 1" && h.tipo === "Nuevo" && ultimaFechaCarga != null && h.fecha === ultimaFechaCarga).map((h) => h.codigo)), [historial, ultimaFechaCarga]);
  const r2ModifiedLatest = useMemo(() => new Set(historial.filter((h) => h.reporte === "Reporte 2" && h.tipo === "Modificado" && ultimaFechaCarga != null && h.fecha === ultimaFechaCarga).map((h) => h.codigo)), [historial, ultimaFechaCarga]);
  const r2NewLatest = useMemo(() => new Set(historial.filter((h) => h.reporte === "Reporte 2" && h.tipo === "Nuevo" && ultimaFechaCarga != null && h.fecha === ultimaFechaCarga).map((h) => h.codigo)), [historial, ultimaFechaCarga]);

  /* KPIs de tarjetas 3 y 4: SOLO comparan la última carga (por fecha,
     indistintamente de si fue Reporte 1 o Reporte 2) contra el estado
     anterior de cada tarea — no el historial acumulado. Reusan los
     mismos sets de arriba, que ya identifican, por Reporte+Código, qué
     tareas son nuevas o modificadas exclusivamente en esa fecha. Reporte
     1 y Reporte 2 se suman porque sus códigos son independientes entre
     sí (un mismo código en R1 y en R2 son tareas distintas). */
  const kpiAltas = useMemo(() => r1NewLatest.size + r2NewLatest.size, [r1NewLatest, r2NewLatest]);
  const kpiModificadas = useMemo(() => r1ModifiedLatest.size + r2ModifiedLatest.size, [r1ModifiedLatest, r2ModifiedLatest]);

  /* Cantidad de filtros activos por pestaña (para el botón "Filtros (n)") */
  const activeCountCambios = [fReporte, fTipo, fProyecto, fCampo, fDesde, fHasta, fBusqueda, fQoEstado, fPoEstado].filter(Boolean).length;
  const activeCountB1 = [b1Busqueda, b1Estado, b1Proyecto].filter(Boolean).length;
  const activeCountB2 = [b2Busqueda, b2Estado, b2Proyecto, b2QoEstado, b2PoEstado].filter(Boolean).length;
  const activeCountForTab = tab === "cambios" ? activeCountCambios : tab === "base1" ? activeCountB1 : activeCountB2;

  const ultimaActualizacion = useMemo(() => {
    if (!ultimaFechaCarga) return null;
    const [y, m, day] = ultimaFechaCarga.split("-");
    return `${day}/${m}/${y}`;
  }, [ultimaFechaCarga]);

  if (!loaded) {
    return <div className="flex items-center justify-center h-64" style={{ color: C.textMuted }}>Cargando base de control...</div>;
  }

  const mobileVisible = (...names) => (names.includes(mobileView) ? "block" : "hidden") + " md:block";

  const currentBusqueda = tab === "cambios" ? fBusqueda : tab === "base1" ? b1Busqueda : b2Busqueda;
  const setCurrentBusqueda = tab === "cambios" ? setFBusqueda : tab === "base1" ? setB1Busqueda : setB2Busqueda;
  const filtersPanelOpen = filtersOpen;

  const handleMobileNav = (id) => {
    setMobileView(id);
  };

  return (
    <div style={{ fontFamily: "'Inter', system-ui, sans-serif", minHeight: "100vh" }} className="px-4 sm:px-6 pt-5 sm:pt-6 pb-24 md:pb-6">

      {/* Inputs de archivo ocultos (misma lógica de siempre) */}
      <input ref={filesInputRef} type="file" accept=".xlsx,.xls" multiple className="hidden"
        onChange={(e) => { if (e.target.files && e.target.files.length) handleFiles(e.target.files); e.target.value = ""; }} />
      <input ref={importInputRef} type="file" accept=".json" className="hidden"
        onChange={(e) => { const f = e.target.files?.[0]; if (f) handleImportFile(f); e.target.value = ""; }} />

      {/* ENCABEZADO */}
      <div className="flex items-center justify-between gap-3 mb-1 flex-wrap">
        <div className="flex items-center gap-3">
          <div className="w-10 h-10 rounded-xl flex items-center justify-center overflow-hidden flex-shrink-0" style={{ background: "#FFFFFF", border: `1px solid ${C.border}` }}>
            <img src={APP_LOGO} alt="Logo" className="w-full h-full object-contain" />
          </div>
          <div>
            <h1 className="text-lg sm:text-xl font-extrabold tracking-tight leading-tight" style={{ color: C.textLight }}>CONTROL DE VENTAS</h1>
            <p className="text-xs sm:text-sm" style={{ color: C.textMuted }}>Seguimiento de Eventuales</p>
          </div>

          {/* Acciones de administración: cinco botones fijos, en la misma fila del logo */}
          <div className="flex items-center gap-1.5 ml-2">
            <input type="date" value={uploadDate} onChange={(e) => setUploadDate(e.target.value)}
              title="Fecha de carga"
              className="text-xs rounded-lg px-1.5 py-2 outline-none hidden lg:block"
              style={{ border: `1px solid ${C.border}`, backgroundColor: C.cardAlt, color: C.textLight, width: 118 }} />
            <button onClick={() => filesInputRef.current?.click()} disabled={busy}
              title={busy ? "Procesando..." : "Cargar Reportes"}
              className="p-2.5 rounded-xl"
              style={{ background: `linear-gradient(135deg, ${C.primary}, ${C.violet})`, color: "#FFFFFF", opacity: busy ? 0.6 : 1 }}>
              <IconUpload size={16} />
            </button>
            <button onClick={exportExcel} title="Exportar a Excel"
              className="p-2.5 rounded-xl"
              style={{ background: `linear-gradient(135deg, ${C.teal}, ${C.primary})`, color: "#FFFFFF" }}>
              <IconDownload size={16} />
            </button>
            <button onClick={exportJSON} title="Guardar copia (JSON)"
              className="p-2.5 rounded-xl"
              style={{ backgroundColor: C.cardAlt, color: C.textLight, border: `1px solid ${C.border}` }}>
              <IconSave size={16} />
            </button>
            <button onClick={() => importInputRef.current?.click()} title="Restaurar copia (JSON)"
              className="p-2.5 rounded-xl"
              style={{ backgroundColor: C.cardAlt, color: C.textLight, border: `1px solid ${C.border}` }}>
              <IconFileUp size={16} />
            </button>
            <button onClick={() => setShowResetConfirm(true)} title="Reiniciar base de control"
              className="p-2.5 rounded-xl"
              style={{ backgroundColor: C.roseSoft, color: C.rose }}>
              <IconTrash size={16} />
            </button>
          </div>
        </div>

        {/* Alertas compactas (tamaño tarjeta), centradas en la fila del logo */}
        <div className="flex-1 flex items-center justify-center gap-2 flex-wrap order-3 md:order-none w-full md:w-auto">
          {alertBanner && (
            <div className="flex items-center gap-2 px-3.5 py-2.5 rounded-xl text-xs font-medium max-w-xs" style={{ backgroundColor: C.tealSoft, color: C.teal }}>
              <IconSpark size={14} className="flex-shrink-0" />
              <span className="truncate">
                {alertBanner.message
                  ? alertBanner.message
                  : `${alertBanner.reporte}: ${alertBanner.total} novedades — ${alertBanner.nuevos} nuevas, ${alertBanner.modificados} modificadas.`}
              </span>
              <button onClick={() => setAlertBanner(null)} className="flex-shrink-0"><IconX size={13} /></button>
            </div>
          )}
          {kpiModificadas > 0 && (
            <button
              onClick={() => { setFTipo("Modificado"); setFDesde(ultimaFechaCarga || ""); setFHasta(ultimaFechaCarga || ""); goToVentas("cambios"); }}
              className="flex items-center gap-2 px-3.5 py-2.5 rounded-xl text-xs font-bold max-w-xs transition-opacity hover:opacity-90"
              style={{ backgroundColor: C.roseSoft, border: `1px solid ${C.rose}`, color: C.rose }}>
              <IconAlert size={14} className="flex-shrink-0" />
              <span className="truncate">{kpiModificadas} {kpiModificadas === 1 ? "modificada" : "modificadas"} · ver</span>
            </button>
          )}
        </div>

        <div className="flex items-center gap-2">
          {CLIENTES.length > 1 && <ClienteSwitcher cliente={cliente} onChange={cambiarCliente} />}
          <button onClick={() => refreshShared(true)} disabled={refreshing}
            title={lastSync ? `Última actualización: ${lastSync.toLocaleTimeString("es-AR")}` : "Actualizar"}
            className="flex items-center gap-1.5 px-2.5 py-2.5 rounded-xl text-sm font-semibold"
            style={{ backgroundColor: C.cardAlt, color: C.textLight, border: `1px solid ${C.border}`, opacity: refreshing ? 0.6 : 1 }}>
            <IconRefresh size={15} className={refreshing ? "spin-icon" : ""} />
          </button>
          <button onClick={() => setShowInfoPanel(true)} title="Información"
            className="flex items-center gap-1.5 px-3 py-2.5 rounded-xl text-sm font-semibold"
            style={{ border: `1px solid ${C.border}`, backgroundColor: C.card, color: C.textLight }}>
            <IconInfo size={16} />
          </button>
        </div>
      </div>
      {ultimaActualizacion && <div className="text-xs mb-3" style={{ color: C.textMuted }}>Última actualización: {ultimaActualizacion}</div>}
      <div className="mb-2" />

      {error && (
        <div className="mb-4 px-4 py-3 rounded-xl text-sm flex items-center justify-between" style={{ backgroundColor: C.roseSoft, color: C.rose }}>
          <span className="flex items-center gap-2"><IconAlert size={16} /> {error}</span>
          <button onClick={() => setError("")}><IconX size={16} /></button>
        </div>
      )}

      {/* ======================= VISTA: RESUMEN ======================= */}
      <div className={mobileVisible("resumen")}>
        <div className="grid grid-cols-2 md:grid-cols-4 gap-3 mb-4">
          <KPI label="Tareas Reporte 1" value={Object.keys(r1Base).length} sub="Stock actual" accent={C.primary} onClick={() => goToVentas("base1")} />
          <KPI label="Tareas Reporte 2" value={Object.keys(r2Base).length} sub="Stock actual" accent={C.violet} onClick={() => goToVentas("base2")} />
          <KPI label="Altas registradas" value={kpiAltas} sub="Comparación última vs. anteúltima carga" accent={C.teal} onClick={() => { setFTipo("Nuevo"); setFDesde(ultimaFechaCarga || ""); setFHasta(ultimaFechaCarga || ""); goToVentas("cambios"); }} />
          <KPI label="Tareas modificadas" value={kpiModificadas} sub="Comparación última vs. anteúltima carga" accent={C.rose} onClick={() => { setFTipo("Modificado"); setFDesde(ultimaFechaCarga || ""); setFHasta(ultimaFechaCarga || ""); goToVentas("cambios"); }} />
        </div>

        <Card className="px-5 py-3.5 mb-4">
          <div className="flex gap-4 flex-wrap text-xs" style={{ color: C.textMuted }}>
            <span>Reporte 1: <strong style={{ color: C.textLight }}>{Object.keys(r1Base).length}</strong> tareas — última carga: {meta.lastR1 || "sin datos todavía"}</span>
            <span>Reporte 2: <strong style={{ color: C.textLight }}>{Object.keys(r2Base).length}</strong> tareas — última carga: {meta.lastR2 || "sin datos todavía"}</span>
            <span>Se detecta automáticamente si cada archivo cargado es Reporte 1 o Reporte 2 por su columna clave.</span>
          </div>
        </Card>

        <Card className="p-5 mb-4">
          <h2 className="text-sm font-bold mb-3" style={{ color: C.textLight }}>Estado de las ventas</h2>
          {estadoVentasCounts.length === 0 ? (
            <div className="text-xs" style={{ color: C.textMuted }}>Sin datos de Reporte 2 todavía.</div>
          ) : (
            <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-2">
              {estadoVentasCounts.map(([estado, count]) => {
                const colors = ESTADO_TAREA_COLORS[estado] || { bg: "rgba(0,0,0,0.05)", fg: C.textMuted };
                return (
                  <button key={estado}
                    onClick={() => { setB2Estado(estado === "Sin estado" ? "" : estado); goToVentas("base2"); }}
                    className="flex flex-col gap-1 px-4 py-3 rounded-xl text-left transition-opacity hover:opacity-90"
                    style={{ backgroundColor: colors.bg }}>
                    <span className="text-xl font-extrabold" style={{ color: colors.fg }}>{count}</span>
                    <span className="text-xs font-semibold" style={{ color: colors.fg }}>{estado}</span>
                  </button>
                );
              })}
            </div>
          )}
        </Card>
      </div>

      {/* ======================= ALERTAS (Resumen + Alertas) ======================= */}
      <div className={mobileVisible("resumen", "alertas")}>
        <Card className="p-5 mb-4">
          <div className="flex items-center gap-2 mb-3">
            <IconAlert size={16} color={C.rose} />
            <h2 className="text-sm font-bold" style={{ color: C.textLight }}>Requieren atención</h2>
          </div>
          {alertsWithData.length === 0 ? (
            <div className="text-xs" style={{ color: C.textMuted }}>Sin alertas pendientes por ahora.</div>
          ) : (
            <div className="space-y-2">
              {alertsWithData.map((a) => (
                <div key={a.id}>
                  <button onClick={() => setSelectedAlert(selectedAlert === a.id ? null : a.id)}
                    className="w-full flex items-center justify-between gap-3 px-4 py-3 rounded-xl text-left transition-colors"
                    style={{ backgroundColor: selectedAlert === a.id ? C.cardAlt : "transparent", border: `1px solid ${C.border}` }}>
                    <span className="text-sm font-medium flex items-center gap-2 min-w-0" style={{ color: C.textLight }}>
                      <span className="w-2 h-2 rounded-full flex-shrink-0" style={{ backgroundColor: a.color }} />
                      <span className="truncate">{a.label}</span>
                    </span>
                    <span className="flex items-center gap-2 flex-shrink-0">
                      <span className="text-sm font-bold" style={{ color: a.color }}>{a.count}</span>
                      <IconChevronDown size={13} color={C.textMuted} style={{ transform: selectedAlert === a.id ? "rotate(180deg)" : "none", transition: "transform 0.15s" }} />
                    </span>
                  </button>
                  {selectedAlert === a.id && (
                    <div className="mt-2 mb-1 space-y-1.5 pl-2">
                      {a.rows.slice(0, 8).map((r, idx) => (
                        <button key={r.id || r.codigo || idx}
                          onClick={() => { if (a.kind !== "historial") setDetailRecord({ type: a.kind, row: r }); }}
                          className="w-full flex items-center justify-between gap-2 px-3 py-2 rounded-lg text-xs"
                          style={{ backgroundColor: C.cardAlt, color: C.textLight }}>
                          <span className="flex items-center gap-2 min-w-0 flex-shrink-0">
                            <span className="font-mono font-semibold">{r.codigo}</span>
                            <EstadoBadge estado={getEstadoAlerta(a.kind, r)} />
                          </span>
                          <span className="truncate ml-2 text-right" style={{ color: C.textMuted }}>{r.proyecto || (a.kind === "historial" ? r.campo : "")}</span>
                        </button>
                      ))}
                      {a.rows.length > 8 && (
                        <div className="text-[11px] px-3" style={{ color: C.textMuted }}>y {a.rows.length - 8} más...</div>
                      )}
                      <button
                        onClick={() => {
                          if (a.kind === "historial") { setFTipo("Modificado"); setFDesde(sieteDiasAtras); goToVentas("cambios"); }
                          else goToVentas(a.kind === "r1" ? "base1" : "base2");
                        }}
                        className="text-xs font-semibold px-3 py-1" style={{ color: C.primary }}>
                        Ver todos en la tabla →
                      </button>
                    </div>
                  )}
                </div>
              ))}
            </div>
          )}
        </Card>
      </div>

      {/* ======================= VENTAS ======================= */}
      <div className={mobileVisible("ventas")}>
        <div className="flex gap-2 mb-4 flex-wrap">
          {[{ id: "cambios", label: "Cambios detectados" }, { id: "base1", label: "Base Reporte 1" }, { id: "base2", label: "Base Reporte 2" }].map((t) => (
            <button key={t.id} onClick={() => setTab(t.id)} className="px-4 py-2 rounded-lg text-sm font-semibold"
              style={{ backgroundColor: tab === t.id ? C.primary : C.card, color: tab === t.id ? "#FFFFFF" : C.textMuted, border: `1px solid ${tab === t.id ? C.primary : C.border}` }}>
              {t.label}
            </button>
          ))}
        </div>

        <div className="flex flex-col sm:flex-row gap-2 mb-4">
          <div className="flex-1"><MainSearch value={currentBusqueda} onChange={setCurrentBusqueda} /></div>
          <FiltersToggle count={activeCountForTab} open={filtersPanelOpen} onToggle={() => setFiltersOpen((v) => !v)} />
        </div>

        {tab === "cambios" && (
          <React.Fragment>
            {filtersPanelOpen && (
              <Card className="p-4 mb-4" style={{ backgroundColor: C.primary, border: `1px solid ${C.violet}` }}>
                <div className="flex items-center gap-2 mb-3">
                  <IconFilter size={16} color="#FFFFFF" />
                  <span className="text-sm font-semibold" style={{ color: "#FFFFFF" }}>Filtros</span>
                  {(fReporte || fTipo || fProyecto || fCampo || fDesde || fHasta || fBusqueda || fQoEstado || fPoEstado) && (
                    <button onClick={clearFilters} className="text-xs ml-2" style={{ color: "#FFFFFF", textDecoration: "underline" }}>Limpiar filtros</button>
                  )}
                </div>
                <div className="flex flex-wrap gap-3">
                  <Select dark value={fReporte} onChange={setFReporte} options={reportes} placeholder="Todos los reportes" />
                  <Select dark value={fTipo} onChange={setFTipo} options={tipos} placeholder="Todos los tipos" />
                  <Select dark value={fProyecto} onChange={setFProyecto} options={proyectos} placeholder="Todos los proyectos" />
                  <Select dark value={fCampo} onChange={setFCampo} options={campos} placeholder="Todos los campos" />
                  <Select dark value={fQoEstado} onChange={setFQoEstado} options={cambiosQoEstados} placeholder="Todos los estados QO" />
                  <Select dark value={fPoEstado} onChange={setFPoEstado} options={cambiosPoEstados} placeholder="Todos los estados PO" />
                  <div className="flex items-center gap-1">
                    <span className="text-xs" style={{ color: "#FFFFFF" }}>Desde</span>
                    <ClearableField dark value={fDesde} onClear={() => setFDesde("")}>
                      <input type="date" value={fDesde} onChange={(e) => setFDesde(e.target.value)} className="text-sm rounded-lg px-2 py-2 pr-7" style={{ border: `1px solid rgba(255,255,255,0.35)`, backgroundColor: "rgba(255,255,255,0.08)", color: "#FFFFFF", colorScheme: "dark" }} />
                    </ClearableField>
                  </div>
                  <div className="flex items-center gap-1">
                    <span className="text-xs" style={{ color: "#FFFFFF" }}>Hasta</span>
                    <ClearableField dark value={fHasta} onClear={() => setFHasta("")}>
                      <input type="date" value={fHasta} onChange={(e) => setFHasta(e.target.value)} className="text-sm rounded-lg px-2 py-2 pr-7" style={{ border: `1px solid rgba(255,255,255,0.35)`, backgroundColor: "rgba(255,255,255,0.08)", color: "#FFFFFF", colorScheme: "dark" }} />
                    </ClearableField>
                  </div>
                </div>
                <div className="flex justify-end gap-3 mt-3 sm:hidden">
                  <button onClick={clearFilters} className="px-4 py-2 rounded-lg text-xs font-semibold" style={{ backgroundColor: "rgba(255,255,255,0.12)", color: "#FFFFFF" }}>Limpiar filtros</button>
                  <button onClick={() => setFiltersOpen(false)} className="px-4 py-2 rounded-lg text-xs font-semibold" style={{ backgroundColor: "#FFFFFF", color: C.primary }}>Aplicar filtros</button>
                </div>
              </Card>
            )}

            <div className="flex items-center justify-between mb-2 px-1">
              <span className="text-sm font-semibold" style={{ color: C.textLight }}>
                {cambiosCtl.processed.length} cambio{cambiosCtl.processed.length !== 1 ? "s" : ""} en {cambiosAgrupados.length} tarea{cambiosAgrupados.length !== 1 ? "s" : ""}
              </span>
            </div>

            <div className="space-y-2">
              {cambiosAgrupados.length === 0 && (
                <Card className="p-8 text-center text-sm" style={{ color: C.textMuted }}>
                  Todavía no hay cambios registrados con estos filtros. Cargá un archivo para empezar a construir la base de control.
                </Card>
              )}
              {cambiosAgrupados.map((group) => (
                <TAChangeGroup
                  key={group.key}
                  group={group}
                  expanded={expandedCambios.has(group.key)}
                  onToggle={() => toggleCambioExpand(group.key)}
                  onDetail={() => abrirDetalleDesdeCambio(group)}
                />
              ))}
            </div>
          </React.Fragment>
        )}

        {tab === "base1" && (
          <React.Fragment>
            {filtersPanelOpen && (
              <Card className="p-4 mb-4" style={{ backgroundColor: C.primary, border: `1px solid ${C.violet}` }}>
                <div className="flex items-center gap-2 mb-3">
                  <IconFilter size={16} color="#FFFFFF" />
                  <span className="text-sm font-semibold" style={{ color: "#FFFFFF" }}>Filtros</span>
                  {(b1Busqueda || b1Estado || b1Proyecto) && (
                    <button onClick={clearB1Filters} className="text-xs ml-2" style={{ color: "#FFFFFF", textDecoration: "underline" }}>Limpiar filtros</button>
                  )}
                </div>
                <div className="flex flex-wrap gap-3">
                  <Select dark value={b1Estado} onChange={setB1Estado} options={r1Estados} placeholder="Todos los estados" />
                  <Select dark value={b1Proyecto} onChange={setB1Proyecto} options={r1Proyectos} placeholder="Todos los proyectos" />
                </div>
                <div className="flex justify-end gap-3 mt-3 sm:hidden">
                  <button onClick={clearB1Filters} className="px-4 py-2 rounded-lg text-xs font-semibold" style={{ backgroundColor: "rgba(255,255,255,0.12)", color: "#FFFFFF" }}>Limpiar filtros</button>
                  <button onClick={() => setFiltersOpen(false)} className="px-4 py-2 rounded-lg text-xs font-semibold" style={{ backgroundColor: "#FFFFFF", color: C.primary }}>Aplicar filtros</button>
                </div>
              </Card>
            )}

            <div className="flex items-center justify-between mb-2 px-1">
              <span className="text-sm font-semibold" style={{ color: C.textLight }}>{r1Ctl.processed.length} tarea{r1Ctl.processed.length !== 1 ? "s" : ""}</span>
              {r1Ctl.activeFilterCount > 0 && (
                <button onClick={r1Ctl.clearAllColFilters} className="text-xs flex items-center gap-1" style={{ color: C.primary }}>
                  <IconX size={12} /> Limpiar filtros de columna ({r1Ctl.activeFilterCount})
                </button>
              )}
            </div>

            <div className="hidden md:block">
              <Card className="overflow-hidden">
                <div className="overflow-x-auto max-h-[600px] overflow-y-auto">
                  <table className="w-full text-sm">
                    <thead style={{ backgroundColor: C.cardAlt, position: "sticky", top: 0 }}>
                      <tr>
                        {R1_COLUMNS.map((col) => <ThSortFilter key={col.key} col={col} ctl={r1Ctl} />)}
                      </tr>
                    </thead>
                    <tbody>
                      {r1Ctl.processed.length === 0 && (
                        <tr><td colSpan={R1_COLUMNS.length} className="px-4 py-10 text-center" style={{ color: C.textMuted }}>
                          {Object.keys(r1Base).length === 0 ? "Sin datos cargados de Reporte 1 todavía." : "Ningún resultado con estos filtros."}
                        </td></tr>
                      )}
                      {r1Ctl.processed.map((v) => (
                        <tr key={v.codigo} style={{ borderTop: `1px solid ${C.border}` }} className="hover:bg-black/[0.015]">
                          <td className="px-4 py-2 font-mono text-xs font-semibold" style={{ color: C.textLight }}>{v.codigo}</td>
                          <td className="px-4 py-2" style={{ color: C.textMuted }}>{v.proyecto}</td>
                          <td className="px-4 py-2" style={{ color: C.textMuted }}>{v.sitio}</td>
                          <td className="px-4 py-2" style={{ color: C.textMuted }}>{v.tipo_tarea}</td>
                          <td className="px-4 py-2"><EstadoBadge estado={v.estado} /></td>
                          <td className="px-4 py-2" style={{ color: C.textMuted }}>{v.fecha_plan_inicio}</td>
                          <td className="px-4 py-2" style={{ color: C.textMuted }}>{v.fecha_plan_fin}</td>
                          <td className="px-4 py-2" style={{ color: C.textMuted }}>{v.personal_asignado}</td>
                          <td className="px-4 py-2" style={{ color: C.textMuted }}>{v.contratista_asignado}</td>
                          <td className="px-4 py-2 text-xs" style={{ color: C.textMuted }}>{v._updated}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </Card>
            </div>

            <div className="md:hidden grid grid-cols-1 sm:grid-cols-2 gap-3">
              {r1Ctl.processed.length === 0 && (
                <Card className="p-6 text-center text-sm col-span-full" style={{ color: C.textMuted }}>
                  {Object.keys(r1Base).length === 0 ? "Sin datos cargados de Reporte 1 todavía." : "Ningún resultado con estos filtros."}
                </Card>
              )}
              {r1Ctl.processed.map((v) => (
                <RecordCardR1 key={v.codigo} row={v}
                  isModified={r1ModifiedLatest.has(v.codigo)} isNew={r1NewLatest.has(v.codigo)}
                  onDetail={() => setDetailRecord({ type: "r1", row: v })} />
              ))}
            </div>
          </React.Fragment>
        )}

        {tab === "base2" && (
          <React.Fragment>
            {filtersPanelOpen && (
              <Card className="p-4 mb-4" style={{ backgroundColor: C.primary, border: `1px solid ${C.violet}` }}>
                <div className="flex items-center gap-2 mb-3">
                  <IconFilter size={16} color="#FFFFFF" />
                  <span className="text-sm font-semibold" style={{ color: "#FFFFFF" }}>Filtros</span>
                  {(b2Busqueda || b2Estado || b2Proyecto || b2QoEstado || b2PoEstado) && (
                    <button onClick={clearB2Filters} className="text-xs ml-2" style={{ color: "#FFFFFF", textDecoration: "underline" }}>Limpiar filtros</button>
                  )}
                </div>
                <div className="flex flex-wrap gap-3">
                  <Select dark value={b2Estado} onChange={setB2Estado} options={r2Estados} placeholder="Todos los estados" />
                  <Select dark value={b2Proyecto} onChange={setB2Proyecto} options={r2Proyectos} placeholder="Todos los proyectos" />
                  <Select dark value={b2QoEstado} onChange={setB2QoEstado} options={r2QoEstados} placeholder="Todos los estados QO" />
                  <Select dark value={b2PoEstado} onChange={setB2PoEstado} options={r2PoEstados} placeholder="Todos los estados PO" />
                </div>
                <div className="flex justify-end gap-3 mt-3 sm:hidden">
                  <button onClick={clearB2Filters} className="px-4 py-2 rounded-lg text-xs font-semibold" style={{ backgroundColor: "rgba(255,255,255,0.12)", color: "#FFFFFF" }}>Limpiar filtros</button>
                  <button onClick={() => setFiltersOpen(false)} className="px-4 py-2 rounded-lg text-xs font-semibold" style={{ backgroundColor: "#FFFFFF", color: C.primary }}>Aplicar filtros</button>
                </div>
              </Card>
            )}

            <div className="flex items-center justify-between mb-2 px-1">
              <span className="text-sm font-semibold" style={{ color: C.textLight }}>{r2Ctl.processed.length} tarea{r2Ctl.processed.length !== 1 ? "s" : ""}</span>
              {r2Ctl.activeFilterCount > 0 && (
                <button onClick={r2Ctl.clearAllColFilters} className="text-xs flex items-center gap-1" style={{ color: C.primary }}>
                  <IconX size={12} /> Limpiar filtros de columna ({r2Ctl.activeFilterCount})
                </button>
              )}
            </div>

            <div className="hidden md:block">
              <Card className="overflow-hidden">
                <div className="overflow-x-auto max-h-[600px] overflow-y-auto">
                  <table className="w-full text-sm">
                    <thead style={{ backgroundColor: C.cardAlt, position: "sticky", top: 0 }}>
                      <tr>
                        {R2_COLUMNS.map((col) => <ThSortFilter key={col.key} col={col} ctl={r2Ctl} />)}
                      </tr>
                    </thead>
                    <tbody>
                      {r2Ctl.processed.length === 0 && (
                        <tr><td colSpan={R2_COLUMNS.length} className="px-4 py-10 text-center" style={{ color: C.textMuted }}>
                          {Object.keys(r2Base).length === 0 ? "Sin datos cargados de Reporte 2 todavía." : "Ningún resultado con estos filtros."}
                        </td></tr>
                      )}
                      {r2Ctl.processed.map((v) => (
                        <tr key={v.codigo} style={{ borderTop: `1px solid ${C.border}` }} className="hover:bg-black/[0.015]">
                          <td className="px-4 py-2 font-mono text-xs font-semibold" style={{ color: C.textLight }}>{v.codigo}</td>
                          <td className="px-4 py-2" style={{ color: C.textMuted }}>{v.proyecto}</td>
                          <td className="px-4 py-2"><EstadoBadge estado={v.estado} /></td>
                          <td className="px-4 py-2" style={{ color: C.textMuted }}>{v.qo_codigo}</td>
                          <td className="px-4 py-2" style={{ color: C.textMuted }}>{v.qo_estado}</td>
                          <td className="px-4 py-2" style={{ color: C.textMuted }}>{v.qo_total ? Number(v.qo_total).toLocaleString("es-AR") : "—"}</td>
                          <td className="px-4 py-2" style={{ color: C.textMuted }}>{v.po_codigo}</td>
                          <td className="px-4 py-2" style={{ color: C.textMuted }}>{v.po_estado}</td>
                          <td className="px-4 py-2" style={{ color: C.textMuted }}>{v.po_factura}</td>
                          <td className="px-4 py-2 text-xs" style={{ color: C.textMuted }}>{v._updated}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </Card>
            </div>

            <div className="md:hidden grid grid-cols-1 sm:grid-cols-2 gap-3">
              {r2Ctl.processed.length === 0 && (
                <Card className="p-6 text-center text-sm col-span-full" style={{ color: C.textMuted }}>
                  {Object.keys(r2Base).length === 0 ? "Sin datos cargados de Reporte 2 todavía." : "Ningún resultado con estos filtros."}
                </Card>
              )}
              {r2Ctl.processed.map((v) => (
                <RecordCardR2 key={v.codigo} row={v}
                  isModified={r2ModifiedLatest.has(v.codigo)} isNew={r2NewLatest.has(v.codigo)}
                  onDetail={() => setDetailRecord({ type: "r2", row: v })} />
              ))}
            </div>
          </React.Fragment>
        )}
      </div>

      {/* ======================= MODALES ======================= */}
      {showImportConfirm && pendingImport && (
        <div className="fixed inset-0 flex items-center justify-center z-50" style={{ backgroundColor: "rgba(20,35,28,0.45)" }}>
          <Card className="p-6 max-w-md">
            <div className="flex items-center gap-2 mb-3">
              <IconFileUp color={C.primary} size={20} />
              <span className="font-bold" style={{ color: C.textLight }}>Restaurar copia de seguridad</span>
            </div>
            <p className="text-sm mb-3" style={{ color: C.textMuted }}>
              Este archivo fue exportado el <strong style={{ color: C.textLight }}>{pendingImport.exportedAt ? pendingImport.exportedAt.slice(0,10) : "fecha desconocida"}</strong> y contiene:
            </p>
            <ul className="text-sm mb-4 space-y-1" style={{ color: C.textLight }}>
              <li>• {Object.keys(pendingImport.r1Base || {}).length} tareas de Reporte 1</li>
              <li>• {Object.keys(pendingImport.r2Base || {}).length} tareas de Reporte 2</li>
              <li>• {(pendingImport.historial || []).length} eventos en el historial de cambios</li>
            </ul>
            <p className="text-sm mb-4" style={{ color: C.rose }}>
              Esto reemplaza por completo la base compartida que ven todas las personas que usan este link. Esta acción no se puede deshacer.
            </p>
            <div className="flex gap-2 justify-end">
              <button onClick={() => { setShowImportConfirm(false); setPendingImport(null); }} className="px-4 py-2 rounded-lg text-sm font-medium" style={{ border: `1px solid ${C.border}`, color: C.textLight }}>Cancelar</button>
              <button onClick={confirmImport} className="px-4 py-2 rounded-lg text-sm font-semibold" style={{ backgroundColor: C.primary, color: "#FFFFFF" }}>Sí, restaurar</button>
            </div>
          </Card>
        </div>
      )}

      {showResetConfirm && (
        <div className="fixed inset-0 flex items-center justify-center z-50" style={{ backgroundColor: "rgba(20,35,28,0.45)" }}>
          <Card className="p-6 max-w-sm">
            <div className="flex items-center gap-2 mb-3">
              <IconAlert color={C.rose} size={20} />
              <span className="font-bold" style={{ color: C.textLight }}>Reiniciar base de control</span>
            </div>
            <p className="text-sm mb-4" style={{ color: C.textMuted }}>
              Esto borra la base compartida y todo el historial de cambios para todas las personas que usan este link. La próxima carga tratará todas las tareas como nuevas. Esta acción no se puede deshacer.
            </p>
            <div className="flex gap-2 justify-end">
              <button onClick={() => setShowResetConfirm(false)} className="px-4 py-2 rounded-lg text-sm font-medium" style={{ border: `1px solid ${C.border}`, color: C.textLight }}>Cancelar</button>
              <button onClick={resetAll} className="px-4 py-2 rounded-lg text-sm font-semibold" style={{ backgroundColor: C.rose, color: "#FFFFFF" }}>Sí, reiniciar</button>
            </div>
          </Card>
        </div>
      )}

      <DetailModal record={detailRecord} onClose={() => setDetailRecord(null)} />


      {showInfoPanel && (
        <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center" style={{ backgroundColor: "rgba(20,35,28,0.45)" }} onClick={() => setShowInfoPanel(false)}>
          <div className="w-full sm:max-w-md sm:rounded-2xl rounded-t-2xl overflow-hidden" style={{ backgroundColor: C.card }} onClick={(e) => e.stopPropagation()}>
            <div className="px-5 py-4 flex items-center justify-between" style={{ borderBottom: `1px solid ${C.border}`, backgroundColor: C.cardAlt }}>
              <span className="font-bold text-sm flex items-center gap-2" style={{ color: C.textLight }}><IconInfo size={16} /> Información</span>
              <button onClick={() => setShowInfoPanel(false)}><IconX size={18} color={C.textMuted} /></button>
            </div>
            <div className="p-5 text-xs leading-relaxed" style={{ color: C.textMuted }}>
              Los datos se guardan en la base compartida configurada en esta página: cualquier persona que abra el link publicado ve y edita la misma base.
              {lastSync && <> Última actualización: <strong style={{ color: C.textLight }}>{lastSync.toLocaleTimeString("es-AR")}</strong>.</>}
              <br /><br />
              Recomendado: después de cada carga, tocá <strong style={{ color: C.textLight }}>"Guardar copia (JSON)"</strong> y
              conservá ese archivo como respaldo — usá <strong style={{ color: C.textLight }}>"Restaurar copia (JSON)"</strong> para
              volver a una versión anterior si hiciera falta. Usá "Exportar a Excel" aparte para enviar el reporte por correo.
              <br /><br />
              <strong style={{ color: C.textLight }}>Para instalarla como app en el celular:</strong> abrí este link desde el navegador del teléfono
              (Chrome en Android o Safari en iPhone) y elegí "Agregar a pantalla de inicio" desde el menú (⋮ o el botón de compartir).
              Va a quedar como un ícono más, con el logo y el nombre "Seguimiento de Eventuales".
            </div>
          </div>
        </div>
      )}

      <BottomNav view={mobileView} setView={handleMobileNav} alertCount={totalAlertCount} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>
</body>
</html>
